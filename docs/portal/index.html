you what I'm hoping to do. I want to ask you some questions about the business and how you get customers right now. Fifteen, twenty minutes. At the end, either this is something that could help you and we talk about what that looks like, or it's not a fit and I'll tell you that straight and get out of your hair. Either one is fine with me. That work?"}, {"title": "Shorter version, for a cold call", "quote": "Give me two minutes to ask a couple questions. If it sounds like something, we keep going. If not, I'll leave you alone. Fair?", "text": "Telling them no is a fine outcome is what makes them relax enough to tell you the truth. Do not skip this because it feels like asking permission twice."}]}, {"title": "Discover", "subtitle": "Let them talk. Most of the time they tell you the answer themselves.", "pages": ["5", "6", "7", "7B"], "noteLabel": "My discovery questions, in my order", "note": "playbook-discover", "blocks": [{"title": "11 to 14 questions. Spread them out.", "text": "Call-recording research across 519,000 calls: 11 to 14 targeted questions performs best. More becomes an interrogation. Top performers spread questions through the whole call. Average performers front-load them, then talk.", "quote": "Talk ratio: you 40, them 60."}, {"title": "These three openings get the longest answers", "items": ["“Can you help me understand...”", "“Can you walk me through...”", "“Can you tell me about...”"]}, {"title": "1. START HERE. The story.", "quote": "Before we get into anything, tell me the story of the business. How did you get started?", "text": "Then shut up. They ramble, and in the rambling you get the emotional connection to the thing they built. It is a logical sale and an emotional sale. Most of the time they will tell you their own solution, if you let them talk."}, {"title": "2. How they get customers now", "items": ["“Can you walk me through how customers find you right now?”", "“Of everything you've tried, what's actually worked?”", "“What hasn't?”"], "text": "That last one brings out “I paid someone for SEO and it didn't work” at minute four instead of minute forty. An objection in discovery is information. The same objection at the close is a wall."}, {"title": "3. The problem", "items": ["“What's the part of the business that gives you the most headache right now?”", "“How is that showing up? What does it actually cost you?”", "“How long has that been going on?”"]}, {"title": "4. What it costs", "items": ["“If that got fixed, what changes for you?”", "“What happens if it doesn't get handled this year?”"], "text": "Do not skip the second one. Most reps only ask the happy question."}, {"title": "5. What they can spend. Without asking about budget.", "items": ["“Have you invested in the business this year? What did that look like?”", "“Have you tried advertising or marketing before? Who with?”", "“How many guys do you have running right now?”", "“Are you turning work away, or looking for more?”"], "quote": "Don't spend other people's money with your pockets."}, {"title": "6. Who else is involved. ASK THIS NOW.", "items": ["“If you decided to move on something like this, is that your call or is somebody else in on it?”", "“Who else does this affect day to day?”"], "text": "This is the question that prevents “let me talk to my wife” at the close. Ask it casually, in the middle, like it is a normal thing to know. Skip it and you have not qualified the deal, you have had a nice conversation."}, {"title": "7. Urgency and timeline", "items": ["“Where does fixing this sit on your list right now? Top three, or further down?”", "“Is there anything coming up that makes this more urgent?”"]}, {"title": "When you do not know what to ask next", "text": "Mirror. Repeat their last two or three words back as a question, with your voice going up. You ask nothing and you learn everything.", "quote": "Them: “We've been getting killed on scheduling.”   You: “Getting killed on scheduling?”"}, {"title": "8. Reflect it back. This closes discovery.", "quote": "So from what I'm hearing, you need this, this and that. Am I getting that right?", "text": "Do not assume the problem. Confirm it. If you cannot say their problem back in one sentence, you did not do discovery. Go back."}]}, {"title": "Present and close", "subtitle": "Hand back what you heard. Then say the number and stop talking.", "pages": ["8", "9", "10", "11", "12", "13", "14"], "noteLabel": "My answers to the four objections, in my own words", "note": "playbook-present-and-close", "blocks": [{"title": "Present the outcome, not the product", "text": "This is not a product tour. It is their own words handed back with a solution attached. Outcomes, not features. Proof kept short. Check understanding as you go.", "quote": "Do not stat dump. You will get lost in your own numbers and lose the room."}, {"title": "The yes ladder", "text": "Small agreements stacked so the final ask is not the first yes. Every yes you collect now is ammunition later.", "quote": "Once we get this settled, are you ready to move forward today?"}, {"title": "THE FOUR OBJECTIONS. Their words, not categories.", "items": ["NO NEED: “We get a lot of word of mouth.”  “We're all organic.”  “I let my work speak for itself.”", "BEEN BURNED: “I've tried other companies.”  “I already paid someone for SEO and it didn't work.”", "SOMEBODY ELSE SAID: “A friend of mine told me it didn't work for them.”", "NOT MY DECISION: “Let me talk to my wife.”  “Let me talk to my business partner.”"], "text": "The third is harder than price. You are fighting a trusted source, not a number. The fourth is not an objection at all, it is a discovery failure showing up late. Nothing here fixes it in the moment. Fix it on your next call by asking who else is involved."}, {"title": "Before you answer anything", "text": "Is this a question, a concern, or an objection? They are three different things. Clarify before you respond. Then loop: handle it, rebuild certainty, close again, repeat."}, {"title": "PRICE. The three lines.", "items": ["If they don't see value, five dollars is too much.", "Don't spend other people's money with your pockets.", "Once you let price go, you can't take it back."]}, {"title": "Delivering the number", "items": ["Even when they ask directly, do not blurt it.", "Attach it to the specific problems they described. Not to your feature list.", "Do not bundle extras up front. Free things before agreement buy nothing.", "An objection is not a number. Do not drop price on resistance, find the disconnect."]}, {"title": "THE CLOSE", "quote": "SILENCE IS CONFIDENCE. Say the number and stop talking.", "text": "There will be a weird pause. It feels worse to you than it does to them. Filling it is how reps talk themselves into a discount nobody asked for."}, {"title": "“Let me think about it. Call me tomorrow.”", "text": "Keep it light. Match the tone of the call. Do not offend. Then hand them back their own words.", "quote": "You reached out to us first. You told me your friends are using it and it's working."}, {"title": "The no", "text": "Not everyone buys. A flat no means stop pushing. Walking away well leaves the door open. Arguing closes it permanently."}]}, {"title": "Follow through", "subtitle": "Protect the sale after the yes.", "pages": ["16", "16C", "17"], "noteLabel": "What I promised, exactly", "note": "playbook-follow-through", "blocks": [{"title": "Lock the next step in before you hang up", "text": "A next step is a read on urgency, not a slot on the calendar. If somebody is interested, their interest wavers by next week. Book as close in as the urgency justifies.", "quote": "Hey man, I'm a busy guy, I like to stay on top of things. You got that calendar invite? Could you hit accept on your end? That'd be awesome."}, {"title": "Before you ask for a next step, can you answer these five?", "items": ["What kind of urgency do they have?", "What is their timeline?", "Are they ready to invest?", "How curious are they, really?", "Are they just curious, or actively looking for a solution?"], "text": "If you cannot answer all five, you are not ready to ask. Go back to Discover."}, {"title": "Cold feet is real", "text": "People back out mid-onboarding, after signing and before it finalizes. This is worth rehearsing.", "quote": "I get it. I got you. Let's finish this last part so we can get you going."}, {"title": "Carry them through yourself", "text": "Document exactly what you promised, word for word, so onboarding cannot contradict you. Customer success gets busy. It is your retention, your account, your money."}, {"title": "Then learn from the call", "text": "Write down what worked and what did not. When you listen back you immediately know what you could have said different, or what you said too early, or if you got impatient. You can just tell."}]}, {"title": "Review a call", "subtitle": "It went sideways and you do not know where. Work backward.", "pages": ["15"], "noteLabel": "What I skipped, and what I will do differently", "note": "playbook-review-a-call", "blocks": [{"title": "The problem is almost never where you are. It is one step back.", "text": "Start at the top and find the first no."}, {"title": "Work down this list", "items": ["Did I get permission to keep talking?", "Did I read whether this was cold, warm or burned?", "DID I SET THE UP-FRONT CONTRACT?", "Did I actually do discovery, or did I start pitching?", "Was I under 40 percent of the talking?", "Did I ask them to tell me the story of the business?", "Did I ask 11 to 14 questions, spread out, or did I front-load and then talk?", "Did I say their problem back and get confirmation?", "DO I KNOW WHO ELSE HAS TO SAY YES?", "Do I know what they already spend?", "Did I present outcomes, or did I stat dump?", "Did I get any yeses before I asked?", "Did I loop, or did I fold on the first no?", "DID I STAY SILENT AFTER THE NUMBER?", "Did I book too far out?", "Did I quit on this account too early?"]}, {"title": "If they balked at the price", "text": "Price resistance is diagnostic. Their reaction tells you which step did not land. You do not argue price. You go back and find the hole.", "quote": "An objection is not a number."}, {"title": "Things that are normal", "items": ["You are going to fail every day. When you win, it is worth it.", "Everybody gets QA. Everybody gets QA fails. It is part of it.", "You will feel lost for two weeks. Better by week four.", "Hearing your own voice on a recording is uncomfortable. That is how you get better.", "Most people do not come out of the box killing it. They want to see effort.", "A stranger telling you no never hurt anybody."], "quote": "I still get nervous hopping on the phone calling somebody. I don't think that ever goes away."}]}]}};
'use strict';
const course=DATA.courses[0], editorial=DATA.workshop, $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const title=s=>s.replace(/^\d+\.\d+\s+/,'');
let profile='my-work',db={},storageOK=true;
try{profile=localStorage.getItem('training-active')||profile;db=JSON.parse(localStorage.getItem('training-work-v1')||'{}');if(!db||typeof db!=='object'||Array.isArray(db))db={}}catch{storageOK=false}
function work(){let w=db[profile];if(!w||!Array.isArray(w.done))w=db[profile]={done:[],checks:{},notes:{},last:1};w.notes||={};w.checks||={};return w}
let current=Math.min(8,Math.max(1,Number(work().last)||1)),nav='Workshop',tab='Learn',group=0,bookStage=0,mode='Learner',slide=0,query='',activity=0,objection=0;
const s=()=>course.sessions[current-1],meta=()=>editorial.sessions[current],done=n=>work().done.includes(n),pct=()=>Math.round(work().done.length/8*100);
function save(){try{localStorage.setItem('training-work-v1',JSON.stringify(db));localStorage.setItem('training-active',profile);storageOK=true}catch{storageOK=false;toast('This browser is not saving. Use Download my work to keep a copy.')}}
function toast(t){$('#message').textContent=t;$('#message').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#message').style.display='none',3200)}
function note(key,label,rows=4){return `<label class="writein">${esc(label)}<textarea data-note="${key}" rows="${rows}">${esc(work().notes[key]||'')}</textarea><small class="save-state">${storageOK?'Saved as you write on this browser':'Not saving here. Use Download my work to keep this.'}</small></label>`}
function docs(html){const d=new DOMParser().parseFromString(html,'text/html');return d.body}
function hydrate(){document.querySelectorAll('[data-note]').forEach(e=>e.value=work().notes[e.dataset.note]||'');document.querySelectorAll('[data-check]').forEach(e=>e.checked=!!work().checks[e.dataset.check])}
function header(){return `<header class="topbar"><button class="wordmark" data-nav="Workshop">Reentry &amp; Career Training <span>COMMUNICATIONS, TECHNOLOGY AND WORKPLACE READINESS</span></button><div class="top-actions"><button class="quiet" data-action="profile">${profile==='my-work'?'My work':esc(profile)}</button><button class="quiet" data-action="export">Download my work</button>${nav==='Session'?'<button class="primary" data-action="present">Present session</button>':''}</div></header>`}
function sidebar(){return `<aside class="rail"><p class="rail-label">LEARN. REHEARSE. APPLY.</p><nav aria-label="Main navigation">${['Workshop','Call playbook','Reentry','My progress'].map((n,i)=>`<button data-nav="${n}" class="${nav===n||(nav==='Session'&&n==='Workshop')?'active':''}"><span class="nav-count">0${i+1}</span>${n}</button>`).join('')}</nav><div class="rail-footer"><p>From the interview<br>to the first ninety days.</p><span>Four modules. Eight sessions.</span></div></aside>`}
function outline(){return `<aside class="outline" aria-label="Session navigation"><button class="backlink" data-nav="Workshop">All workshop sessions</button>${course.modules.map(m=>`<div class="module"><div class="module-label"><span>0${m.id}</span>${esc(m.title.replace(' and moving up',''))}</div>${course.sessions.filter(x=>x.module===m.id).map(x=>`<button class="sessionlink ${current===x.id?'active':''}" data-session="${x.id}" ${current===x.id?'aria-current="page"':''}><span class="session-number">${x.id}</span><span>${esc(x.title)}${done(x.id)?'<small>Completed</small>':''}</span></button>`).join('')}</div>`).join('')}</aside>`}
function workshop(){return `<section class="workshop-hero"><div><div class="eyebrow">THE WHOLE JOURNEY</div><h1>Getting hired is<br>just the beginning.</h1><p>Rehearse the interview, the first day, the call<br class="desktop"> and the work that comes after it.</p><div class="hero-actions"><button class="primary" data-session="${current}">${work().last?'Continue with session '+current:'Start the first session'}</button><span>4 modules <b>·</b> 8 sessions</span></div></div><aside class="hero-quote"><span class="quote-label">THE PURPOSE</span><blockquote>The goal is that when the real thing happens, you feel like you have been here before.</blockquote><span>From the course</span></aside></section><div class="section-heading"><div><div class="eyebrow">YOUR WORKSHOP</div><h2>Choose where to begin</h2></div><label class="search-label">Find a session<input id="session-search" type="search" value="${esc(query)}" aria-label="Find a session"></label></div><div class="module-grid" id="module-grid">${moduleCards()}</div>`}
function moduleCards(){return course.modules.map(m=>{const ss=course.sessions.filter(x=>x.module===m.id&&(`${x.title} ${x.topics.map(t=>t.title).join(' ')} ${m.title}`).toLowerCase().includes(query.toLowerCase()));if(!ss.length)return '';return `<section class="module-card"><div class="module-head"><span class="module-index">0${m.id}</span><div><small>MODULE ${m.id}</small><h2>${esc(m.title.replace(' and moving up',''))}</h2></div><span class="session-count">${course.sessions.filter(x=>x.module===m.id).length} ${m.id===1||m.id===3?'sessions':'session'}</span></div><div class="module-session-list">${ss.map(x=>`<button data-session="${x.id}"><span class="row-index">${String(x.id).padStart(2,'0')}</span><span><strong>${esc(x.title)}</strong><small>${esc(editorial.sessions[x.id].description)}</small></span><span class="row-time">${done(x.id)?'Completed':x.time}</span></button>`).join('')}</div></section>`}).join('')||'<p class="search-result">No sessions match your search.</p>'}
function sessionView(){const m=meta(),md=course.modules[s().module-1];return `<div class="eyebrow breadcrumb">${esc(md.title)} <span>·</span> Session ${current} of 8</div><div class="session-heading"><div><h1>${esc(s().title)}</h1><p>${esc(m.description)}</p></div><button class="complete ${done(current)?'is-done':''}" data-action="complete">${done(current)?'Completed':'Mark complete'}</button></div><div class="session-overview"><div class="session-route"><small>IN THIS SESSION</small><nav aria-label="Session sections">${m.groups.map((g,i)=>`<button data-group="${i}" class="${group===i?'active':''}"><span>${String(i+1).padStart(2,'0')}</span>${esc(g[0])}</button>`).join('')}</nav></div></div><div class="tabs" role="tablist" aria-label="Session content">${['Learn','Stories','Practice','My notes'].map(t=>`<button role="tab" aria-selected="${tab===t}" data-tab="${t}" class="${tab===t?'active':''}">${t}</button>`).join('')}<button class="book-shortcut" data-nav="Call playbook">Open call playbook</button></div><div class="lesson-grid"><section class="lesson-panel" role="tabpanel">${tabContent()}</section><aside class="outcomes"><small>WHAT YOU WILL LEAVE WITH</small>${s().outcomes.map((o,i)=>`<label class="check"><input type="checkbox" data-check="${current}-${i}"><span>${esc(o)}</span></label>`).join('')}<blockquote class="side-quote">“${esc(m.quote)}”<cite>From this session</cite></blockquote><div class="outcome-footer">${esc(s().time)} estimated session time</div></aside></div><footer class="session-footer"><button data-session="${current-1}" ${current===1?'disabled':''}>Previous session</button><span>Session ${current} of 8</span><button class="primary" data-session="${current+1}" ${current===8?'disabled':''}>Next session</button></footer>`}
function introView(){const m=meta().introduction;return `<section class="lesson-intro"><h3>${esc(m.title)}</h3><p>${esc(m.text)}</p><div class="work-sequence">${m.steps.map(([a,b])=>`<div><strong>${esc(a)}</strong><p>${esc(b)}</p></div>`).join('')}</div></section>`}
function topicHTML(t){const body=docs(t.html);body.querySelectorAll('blockquote').forEach(q=>{if(q.textContent.replace(/[\W_]/g,'').toLowerCase()===meta().quote.replace(/[\W_]/g,'').toLowerCase())q.remove()});return `<section class="topic" id="topic-${t.id}"><h3>${esc(t.id==='1.3'?'Product knowledge and credibility':title(t.title))}</h3>${body.innerHTML}</section>`}
function tabContent(){if(tab==='Learn'){const g=meta().groups[group];return `<div class="reading-head"><small>SECTION ${group+1} OF ${meta().groups.length}</small><h2>${esc(g[0])}</h2></div>${current===1&&group===0?introView():''}${g[1].map(id=>s().topics.find(t=>t.id===id)).filter(Boolean).map(topicHTML).join('')}<div class="section-nav"><button data-group="${group-1}" ${group===0?'disabled':''}>Previous section</button>${group<meta().groups.length-1?`<button class="primary" data-group="${group+1}">Next section</button>`:'<button class="primary" data-tab="Practice">Put it into practice</button>'}</div>`}
if(tab==='Stories')return `<div class="reading-head"><small>EXPERIENCE YOU CAN USE</small><h2>The story behind the lesson</h2></div>${s().examples.map(topicHTML).join('')}`;
if(tab==='Practice')return practiceView();return `<div class="reading-head"><small>YOUR OWN WORDS</small><h2>Keep what you can use</h2></div>${note('session-'+current,'My notes from this session',9)}`}
function practiceView(){const ps=meta().practice,a=ps[activity]||ps[0];return `<div class="practice-tabs">${ps.map((p,i)=>`<button data-activity="${i}" class="${activity===i?'active':''}">${esc(p.title)}</button>`).join('')}</div><div class="reading-head"><small>${esc(a.format.toUpperCase())}</small><h2>${esc(a.title)}</h2></div><ol class="practice-steps">${a.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><div class="takeaway"><small>WHAT YOU KEEP</small><p>${esc(a.output)}</p></div>${practiceMaterials()}${note('practice-'+current+'-'+activity,'My working notes',5)}${work().notes['practice-'+current]?note('practice-'+current,'My earlier practice reflection',4):''}${current===7&&activity===1?'<div class="timer"><span id="timer-clock" aria-live="off">00:00</span><button data-action="timer">Start timer</button><button data-action="timer-reset">Reset</button></div>':''}<details class="source-guidance"><summary>Using AI in this session</summary>${s().ai}</details>`}
const objections=["We get a lot of word of mouth.","I already paid someone for SEO and it didn't work.","A friend of mine told me it didn't work for them.","Let me talk to my business partner."];
function practiceMaterials(){if(current===7&&activity===0)return `<div class="objection-card"><small>THE CUSTOMER SAYS</small><blockquote>“${esc(objections[objection])}”</blockquote><button data-action="objection">Next objection</button><span>${objection+1} of 4</span></div>`;if(current===3&&activity===0)return `<div class="practice-material"><h3>The three questions</h3><ol><li>What does a successful 30, 60 and 90 days look like in this role?</li><li>What do the top performers do consistently here?</li><li>What are the top three things I can do coming in to really set myself apart?</li></ol></div>`;if(current===4&&activity===1){const t=s().topics.find(t=>t.id==='4.2');return `<div class="practice-material"><h3>My example of one month</h3>${docs(t.html).querySelector('table')?.outerHTML||''}</div>`}return ''}

function bookBlocks(stage){return stage.blocks.map(b=>`<section class="book-block"><h3>${esc(b.title)}</h3>${b.quote?`<blockquote>“${esc(b.quote)}”</blockquote>`:''}${b.items?`<ul>${b.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}${b.text?`<p>${esc(b.text)}</p>`:''}</section>`).join('')}
function pageTarget(id){return editorial.playbook.findIndex(g=>g.pages.includes(id))}
function handbookDetails(stage){return stage.pages.map(id=>{const p=DATA.pages.find(x=>x.id===id),body=docs(p.html);body.querySelectorAll('.writein').forEach(el=>{const key=el.querySelector('textarea')?.dataset.note;el.replaceWith(docs(note(key,'My saved wording',3)).firstElementChild)});body.querySelectorAll('[data-page]').forEach(el=>{const idx=pageTarget(el.dataset.page);el.textContent=idx>=0?editorial.playbook[idx].title:'Review a call'});let text=body.innerHTML.replace(/<p><strong>You are here if:<\/strong>.*?<\/p>/s,'');return `<section class="handbook-section"><h3>${esc(p.title.replace(/^Did i qualify.*$/,'Qualifying the conversation').replace(/^When to let an account go$/,'Account follow-up'))}</h3>${text}</section>`}).join('')}
function playbook(){const b=editorial.playbook[bookStage];return `<div class="book-heading"><div><div class="eyebrow">AT HAND WHEN YOU NEED IT</div><h1>The call playbook</h1><p>One conversation, start to finish. Your own words.</p></div><button class="outline-button" data-action="review-call">Review a call</button></div><nav class="book-stages" aria-label="Call stages">${editorial.playbook.map((g,i)=>`<button data-stage="${i}" class="${bookStage===i?'active':''}"><span>0${i+1}</span><strong>${esc(g.title)}</strong></button>`).join('')}</nav><div class="book-spread"><article class="book-main"><div class="book-title"><small>0${bookStage+1}</small><div><h2>${esc(b.title)}</h2><p>${esc(b.subtitle)}</p></div></div><div class="book-blocks">${bookBlocks(b)}</div></article><aside class="book-writing"><small>MAKE IT YOURS</small><h2>Words you would<br>actually say.</h2>${note(b.note,b.noteLabel,7)}<p class="writing-tip">The lines printed here are somebody else's. Rewrite them in your own voice.</p></aside></div><details class="source-guidance handbook-details"><summary>More guidance for ${esc(b.title.toLowerCase())}</summary>${handbookDetails(b)}</details><div class="section-nav"><button data-stage="${bookStage-1}" ${bookStage===0?'disabled':''}>Previous stage</button><button class="primary" data-stage="${bookStage+1}" ${bookStage===editorial.playbook.length-1?'disabled':''}>Next stage</button></div>`}

function reentry(){
 const sk=(n,t,sub,body)=>`<details class="line"${n==='01'?' open':''}><summary><span class="lnum">${n}</span><span class="ltitle"><strong>${t}</strong><span>${sub}</span></span><span class="chev">OPEN</span></summary><div class="rbody">${body}</div></details>`;
 const t=(h,p)=>`<div class="rt"><strong>${h}</strong><p>${p}</p></div>`;
 return `<div class="eyebrow">REENTRY</div>
<h1>What we work on,<br>and how.</h1>
<p class="intro-copy">The skills covered and how they get practiced. This is about coming home and going to work, whatever the work ends up being.</p>

<div class="rgap tight"><div class="eyebrow">WHY ME</div><h2>Three employers ran my record<br>and hired me anyway.</h2>
<p>I came home, went to work in sales, and built a career doing it. What is in here is what I actually did.</p>
<p><b>The one that taught me the most:</b> the same company hired me for a professional role and turned me down for a delivery job. Same person, same record, two different answers. For the delivery job a system decided and I never talked to anybody. <b>Communication is what made the difference, and communication is what I can teach.</b></p></div>

<h2 class="rsec">The skills</h2><p class="intro-copy">Eight areas. Each one is worked through, practiced with a partner, and reviewed.</p>
<div class="lines">

${sk('01','Communication','The core of all of it.',
 `<div class="rtopics">
 ${t('Starting a conversation','Opening with somebody who is not expecting to hear from you. Your name, a reason, a question. Short enough that they let you keep talking.')}
 ${t('Reading the reaction','Busy, annoyed, curious, distracted. Each one gets a different second sentence. Most people talk straight through it and lose the room.')}
 ${t('Asking, then listening','An open question, then a second question about what they just said. Talking less than the other person is a trainable skill and we count it.')}
 ${t('Saying who you are in thirty seconds','As a person, not a script. This gets used in every interview, every networking moment, every first conversation.')}
 ${t('Handling pushback','No, not now, or a reason that is not the real reason. Practiced until the answer stops shaking.')}
 ${t('Talking to a supervisor','Asking for help before it is a problem. Taking correction without going quiet. Saying you are behind while it can still be fixed.')}
 ${t('Hearing no without carrying it','A stranger telling you no costs you nothing. What costs you is carrying the last one into the next conversation, because people hear it in your voice. This gets worked on deliberately.')}
 </div>`)}

${sk('02','The resume, and getting past the filter','Turning a real work history into something a screener can read.',
 `<div class="rtopics">
 ${t('How applicant tracking systems read a resume','Most applications get filtered before a person sees them. The scanner reads words, not design. A resume with colors and a photo looks good in a hand and works against you in a system.')}
 ${t('Keywords from the actual posting','Read the description, pull the language out of it, and use their words where they are true. This is not a trick, it is matching what they asked for.')}
 ${t('Transferring experience they already have','Warehouse, kitchen, crew lead, driving, trades, hospitality. Running a crew is managing people. Dealing with homeowners is customer work. High volume anything is pressure and pace.')}
 ${t('Writing it as accomplishment, not duty','What you did, in what setting, and what came of it. Nothing invented. If it cannot be defended in an interview it does not go on the page.')}
 ${t('Gaps, handled plainly','Said briefly and calmly, the same way the record is handled. A gap explained is smaller than a gap dodged.')}
 ${t('The profile that backs it up','A basic professional profile that matches the resume, because recruiters look and because it is how they find people.')}
 </div>`)}

${sk('03','Interviews','Preparing for the room, and practicing before it counts.',
 `<div class="rtopics">
 ${t('Who they will actually meet','A recruiter, then a hiring manager, then often a team lead. The team lead is who they will work with day to day. Knowing that changes how they show up.')}
 ${t('Tell me about yourself','The thirty seconds again, aimed at the job in front of them.')}
 ${t('Questions to ask back','Three of them, matched to who they are talking to. Not asking anything reads as not caring.')}
 ${t('Practice interviews','Run live, with a partner or with me. Repeated. This is where nerves get worked out, not on the real one.')}
 ${t('Talking to a recruiter','What they are actually listening for, what to say about pay when it comes up early, and how to end the call so there is a next step.')}
 ${t('Questions written down before the call','Three of them, matched to who they are talking to, on paper in front of them. Nobody improvises good questions while nervous.')}
 ${t('Tracking who they applied to','A simple running list. Where, when, who they talked to, what was said, what is owed and when. Most people lose track by week two and stop following up.')}
 ${t('Following up','What to send, when, and to who. Drafted together the first few times.')}
 </div>`)}

${sk('04','The record conversation','Thirty seconds, said steady, then back to the job.',
 `<div class="rtopics">
 ${t('When it comes up','Sometimes on the application, sometimes at the background check, sometimes not until an offer. Knowing which one you are dealing with changes the plan.')}
 ${t('Who you tell','Usually the recruiter. Not the whole room.')}
 ${t('What you say','What happened, that it is behind you, what you have done since. Short. No excuses and no detail nobody asked for.')}
 ${t('Getting back to the job','The longer you stay in it, the bigger it gets. The handoff sentence gets practiced as hard as the answer.')}
 </div><p>This gets rehearsed out loud with another person before it is ever said to an employer.</p>`)}

${sk('05','Where to spend the effort','Human or system, and which doors are actually open.',
 `<div class="rtopics">
 ${t('Where a system decides','Online applications that screen automatically, gig platforms, large chains with automated policies. No conversation happens, so there is nothing to talk through.')}
 ${t('Where a person decides','Smaller employers, roles where you meet a hiring manager early, anywhere somebody can look at you and make a call.')}
 ${t('Fair chance employers','Companies with a stated policy on hiring people with records. They exist, the list changes, and we go find who is hiring openly right now rather than guessing.')}
 ${t('Reading the posting instead of the title','Requirements are often softer than they look. Preferred is not required.')}
 ${t('Not disqualifying yourself','The most common mistake is not applying at all. Let them say no.')}
 ${t('The honest part','Some employers and some industries will not open. Knowing which is which saves months of effort.')}
 </div>`)}

${sk('06','Staying in the job','The first ninety days after somebody starts.',
 `<div class="rtopics">
 ${t('What is expected at thirty, sixty and ninety days','Most people are not told and assume they are failing when they are on pace.')}
 ${t('Taking coaching','Hearing a correction without shutting down or getting defensive. This is the one that gets people let go.')}
 ${t('Speaking up early','Saying you are struggling while it is still fixable, instead of going quiet and hoping.')}
 ${t('What normal feels like','Lost for two weeks, better by week four. Everybody. Knowing that in advance keeps people from quitting in week two.')}
 ${t('Getting the job is half of it','Staying in it is the other half, and it is the half that decides whether the placement holds. We cover it before the first day, not after something goes wrong.')}
 ${t('What actually gets people let go','Almost never talent. Effort, coachability, and going quiet when something is wrong. Naming it in advance is most of the fix.')}
 </div>`)}

${sk('07','Tools they will be expected to know','So nobody walks in behind.',
 `<div class="rtopics">
 ${t('What a workplace assumes you can do','Email, calendar, shared documents, a basic system for tracking your own work.')}
 ${t('AI tools, used honestly','Researching an employer before an interview, organizing a job search, drafting and then checking. Every time, the person verifies what it gave them. It is a tool, not an answer.')}
 ${t('Why this matters now','Being behind on tools is a real barrier at the moment of hire and it is a fixable one.')}
 </div>`)}

${sk('08','Staying steady while you are looking','The pressure side of it, from somebody who has been through it.',
 `<p><b>This is practical support, not clinical.</b> I am straight with people about what this stretch actually feels like, because I went through it, and I give them something to do with it. When something calls for a trained professional, I say so and help them get to the right place.</p><div class="rtopics">
 ${t('What the looking stretch does to you','Weeks of no answers wears people down and they start to take it personally. Naming that in advance keeps it from being a surprise.')}
 ${t('Pressure from outside','Money, family, people waiting on you, and the pull of the thing that pays right now instead of the thing that pays later. Real, and worth talking about plainly instead of pretending it is not there.')}
 ${t('Something to do on a bad day','When nothing is landing, the answer is a smaller task you can finish. A list to clean up, one follow up to send, one practice conversation. Motion beats sitting with it.')}
 ${t('Staying focused in transition','Keeping a routine when nobody is making you. What the week looks like, what gets done before noon, and how to tell a slow week from a wasted one.')}
 ${t('Not letting the last no into the next call','The most practical version of the mental side. People hear the last rejection in your voice. Working on that is a skill, not a mood.')}
 </div>`)}
</div>

<h2 class="rsec">How it is delivered</h2>
<div class="rgrid">
<div class="rcard"><h3>In a group</h3><p>Sessions with other people in the same position. Practice happens with a partner, out loud, in the room. Recorded only if the person agrees to it.</p></div>
<div class="rcard"><h3>One on one</h3><p>For the parts that are personal. The record conversation, a specific resume, a specific interview coming up. Repeated until it is steady.</p></div>
<div class="rcard"><h3>Out where people are</h3><p>Not only in a classroom. Meeting somebody where they are, going to an interview with them if they want that and the employer is comfortable with it.</p></div>
<div class="rcard"><h3>After they are hired</h3><p>Checking in through the first ninety days. Working through a problem with a supervisor while it is still small.</p></div>
</div>

`;
}

function progressView(){const written=noteEntries().length;return `<div class="eyebrow">YOUR WORK</div><h1>What you have worked through</h1><p class="intro-copy">${work().done.length} of 8 sessions complete. Your objective check-ins record what you feel ready to do.</p><progress value="${pct()}" max="100" aria-label="Course completion"></progress><div class="progress-list">${course.sessions.map(x=>`<details class="progress-session"><summary><span class="row-index">${String(x.id).padStart(2,'0')}</span><strong>${esc(x.title)}</strong><span>${done(x.id)?'Completed':x.outcomes.some((o,i)=>work().checks[x.id+'-'+i])?'In progress':'Not marked complete'}</span></summary><div class="progress-checks">${x.outcomes.map((o,i)=>`<label class="check"><input type="checkbox" data-check="${x.id}-${i}"><span>${esc(o)}</span></label>`).join('')}<button data-session="${x.id}">Open session</button></div></details>`).join('')}</div><section class="keep-work"><small>TAKE IT WITH YOU</small><h2>Everything you wrote, in one file</h2><p>${written?written+(written===1?' piece':' pieces')+' of your own writing saved so far.':'Nothing written yet. Your words will show up here once you start.'} Download it as one page you can print, keep, or open on another computer.</p><div class="keep-actions"><button class="primary" data-action="export">Download my work</button><button class="outline-button" data-action="import">Bring my work back</button></div><p class="keep-note">Your writing is saved in this browser only. On a shared or lab computer, download it before you leave.</p></section>`}
function excerpt(t){const body=docs(t.html);let el=body.querySelector('ul,ol,table');if(el){if(el.tagName==='TABLE')return el.outerHTML;const list=el.cloneNode(true);[...list.children].slice(3).forEach(x=>x.remove());return list.outerHTML}const ps=[...body.querySelectorAll('p')].filter(p=>p.textContent.trim().length>45&&!p.textContent.includes('Teaching point'));return (ps[0]||body.firstElementChild)?.outerHTML||''}
function slides(){const m=meta();return [{type:'opening',title:s().title,quote:m.quote},...m.presentation,{type:'practice',title:m.practice[0].title,activity:m.practice[0]}]}
function presentation(){const all=slides(),p=all[slide];return `<section class="presentation ${p.type}"><header><span>SALES CAREER <b>WORKSHOP</b></span><span>Session ${current} · ${esc(s().title)}</span></header><main id="main" class="presentation-main">${p.type==='opening'?`<div class="presentation-intro"><div><small>${esc(course.modules[s().module-1].title.toUpperCase())}</small><h1>${esc(p.title)}</h1><p>${esc(meta().description)}</p></div><blockquote>“${esc(p.quote)}”</blockquote></div>`:p.type==='teaching'?`<div class="presentation-title"><small>LET'S WORK THROUGH IT</small><h1>${esc(p.title)}</h1></div><div class="teaching-cards cards-${p.cards.length}">${p.cards.map(c=>`<article><h2>${esc(c.title)}</h2><ul>${c.points.map(point=>`<li>${esc(point)}</li>`).join('')}</ul></article>`).join('')}</div>`:`<div class="presentation-title"><small>${esc(p.activity.format.toUpperCase())}</small><h1>${esc(p.title)}</h1></div><ol class="presentation-steps">${p.activity.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol><div class="presentation-output"><strong>What you keep</strong> ${esc(p.activity.output)}</div>`}</main><footer><button data-action="exit-present">Return to workshop</button><nav aria-label="Presentation screens">${all.map((a,i)=>`<button data-slide="${i}" class="${slide===i?'active':''}" aria-label="${esc(a.title)}">${i+1}</button>`).join('')}</nav><div><button data-action="slide-prev" ${slide===0?'disabled':''}>Previous</button><button data-action="slide-next" ${slide===all.length-1?'disabled':''}>Next</button></div></footer></section>`}
function render(){stopTimer();if(mode==='Presentation'){ $('#app').innerHTML=presentation();return }$('#app').innerHTML=`${header()}${sidebar()}<div class="layout ${nav==='Session'?'has-outline':''}">${nav==='Session'?outline():''}<main id="main" class="main" tabindex="-1">${nav==='Workshop'?workshop():nav==='Call playbook'?playbook():nav==='Reentry'?reentry():nav==='My progress'?progressView():sessionView()}</main></div>`;hydrate();}
function goSession(n){if(n<1||n>8)return;current=n;work().last=n;nav='Session';tab='Learn';group=0;activity=0;save();render();window.scrollTo(0,0)}
function showReview(){const d=document.createElement('dialog');d.className='review-dialog';d.innerHTML=`<form method="dialog"><button class="dialog-close" aria-label="Close review">Close</button></form><div class="eyebrow">AFTER THE CONVERSATION</div><h2>Review a call</h2><p>Find the first step that needs another look.</p>${[['Did I know the account and its history?',0],['Did I get permission and agree on the conversation?',1],['Did I listen, confirm the problem and involve the right people?',2],['Did I connect the solution to their words and stay quiet after the price?',3],['Did I document the promise and protect the next step?',4]].map(([q,i])=>`<button class="review-row" data-stage="${i}"><span>${q}</span><strong>${esc(editorial.playbook[i].title)}</strong></button>`).join('')}`;document.body.append(d);d.addEventListener('close',()=>d.remove());d.showModal()}
let timerHandle=null,timerStart=0,timerElapsed=0;
function stopTimer(){if(timerHandle){clearInterval(timerHandle);timerHandle=null}timerElapsed=0}
function drawClock(){const sec=Math.floor((timerElapsed+(timerHandle?Date.now()-timerStart:0))/1000);if($('#timer-clock'))$('#timer-clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function fileStem(){const d=new Date(),day=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const who=profile==='my-work'?'':'-'+profile.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);return 'my-work'+who+'-'+day}
function noteEntries(){const w=work(),out=[],push=(section,label,key)=>{const v=(w.notes[key]||'').trim();if(v)out.push({section,label,text:v})};
editorial.playbook.forEach(b=>push('My call playbook, in my own words',b.title+'. '+b.noteLabel,b.note));
course.sessions.forEach(x=>{const sec='Session '+x.id+'. '+x.title;push(sec,'My notes from this session','session-'+x.id);push(sec,'My practice reflection','practice-'+x.id);(editorial.sessions[x.id].practice||[]).forEach((pr,i)=>push(sec,'Practice. '+pr.title,'practice-'+x.id+'-'+i))});
DATA.pages.forEach(pg=>{const re=new RegExp('^page-'+pg.id.replace(/[^A-Za-z0-9]/g,'')+'-(\\d+)$');Object.keys(w.notes).filter(k=>re.test(k)).sort((a,b)=>Number(a.match(re)[1])-Number(b.match(re)[1])).forEach((k,i)=>push('My wording from the playbook pages',pg.title+'. Answer '+(i+1),k))});
return out}
function exportDoc(){const w=work(),entries=noteEntries(),who=profile==='my-work'?'My work':profile,
when=new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}),sections=[];
entries.forEach(e=>{let s=sections.find(x=>x.name===e.section);if(!s)sections.push(s={name:e.section,items:[]});s.items.push(e)});
const body=sections.length?sections.map(s=>`<section><h2>${esc(s.name)}</h2>${s.items.map(i=>`<article><h3>${esc(i.label)}</h3><p>${esc(i.text).replace(/\n/g,'<br>')}</p></article>`).join('')}</section>`).join(''):'<p class="empty">Nothing written yet. Open a session or the call playbook, write in your own words, then download this again.</p>';
const rows=course.sessions.map(x=>{const ticks=x.outcomes.filter((o,i)=>w.checks[x.id+'-'+i]);if(!w.done.includes(x.id)&&!ticks.length)return '';return `<li><strong>Session ${x.id}. ${esc(x.title)}</strong>${w.done.includes(x.id)?' <em>marked complete</em>':''}${ticks.length?`<ul>${ticks.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`:''}</li>`}).join('');
const restore=JSON.stringify({participant:profile,exported:new Date().toISOString(),work:w}).replace(/</g,'\\u003c');
const css='*{box-sizing:border-box}body{margin:0;padding:48px 32px;font:16px/1.6 Georgia,"Times New Roman",serif;color:#16181d;background:#fff;max-width:820px;margin:0 auto}header{border-bottom:3px solid #16181d;padding-bottom:20px;margin-bottom:36px}header p.kicker{margin:0;font:600 12px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#6b7280}h1{font:700 40px/1.1 system-ui,sans-serif;margin:14px 0 8px}header p.who{margin:0;color:#4b5563;font-size:15px}h2{font:600 13px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#6b7280;margin:40px 0 0;padding-bottom:10px;border-bottom:1px solid #d8dbe0}article{padding:22px 0;border-bottom:1px solid #eceef1}h3{font:600 15px/1.4 system-ui,sans-serif;margin:0 0 10px;color:#16181d}article p{margin:0;white-space:normal}ul.progress{list-style:none;padding:0;margin:22px 0 0}ul.progress>li{margin-bottom:16px}ul.progress ul{margin:6px 0 0 18px;font-size:15px;color:#4b5563}em{color:#6b7280;font-size:14px}p.empty{margin:40px 0;color:#6b7280}footer{margin-top:48px;padding-top:20px;border-top:1px solid #d8dbe0;font:14px/1.6 system-ui,sans-serif;color:#6b7280}@media print{body{padding:0;font-size:12pt}article,ul.progress>li{break-inside:avoid}}';
return '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc('My work. '+who)+'</title><style>'+css+'</style></head><body>'
+`<header><p class="kicker">Reentry and Career Training</p><h1>My work</h1><p class="who">${profile==='my-work'?'':esc(who)+' &middot; '}${esc(when)}</p></header>`
+body+(rows?`<section><h2>Where I am</h2><ul class="progress">${rows}</ul></section>`:'')
+'<footer>This is your writing, in your words. Keep the file. Opening it back in the portal under "Bring my work back" puts all of it where it was.</footer>'
+'<script type="application/json" id="restore-data">'+restore+'<\/script></body></html>'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
if(b.dataset.nav){nav=b.dataset.nav;render();window.scrollTo(0,0);return}
if(b.dataset.session){goSession(Number(b.dataset.session));return}
if(b.dataset.group!==undefined){group=Number(b.dataset.group);tab='Learn';render();return}
if(b.dataset.tab){tab=b.dataset.tab;render();return}
if(b.dataset.activity){activity=Number(b.dataset.activity);render();return}
if(b.dataset.stage!==undefined){const n=Number(b.dataset.stage);if(n<0||n>=editorial.playbook.length)return;document.querySelectorAll('dialog').forEach(d=>d.remove());bookStage=n;nav='Call playbook';render();window.scrollTo(0,0);return}
if(b.dataset.page){const idx=pageTarget(b.dataset.page);if(idx<0){showReview();return}bookStage=idx;nav='Call playbook';render();window.scrollTo(0,0);return}
if(b.dataset.slide!==undefined){slide=Number(b.dataset.slide);render();return}
switch(b.dataset.action){case 'complete':work().done=done(current)?work().done.filter(n=>n!==current):[...work().done,current];save();render();toast(done(current)?'Session marked complete.':'Completion mark removed.');break;
case 'present':mode='Presentation';slide=0;render();window.scrollTo(0,0);break;case 'exit-present':mode='Learner';render();break;case 'slide-prev':slide=Math.max(0,slide-1);render();break;case 'slide-next':slide=Math.min(slides().length-1,slide+1);render();break;
case 'review-call':showReview();break;case 'objection':objection=(objection+1)%objections.length;render();break;
case 'timer':if(timerHandle){timerElapsed+=Date.now()-timerStart;clearInterval(timerHandle);timerHandle=null;b.textContent='Resume timer'}else{timerStart=Date.now();timerHandle=setInterval(drawClock,200);b.textContent='Stop timer'}drawClock();break;
case 'timer-reset':stopTimer();drawClock();document.querySelector('[data-action="timer"]').textContent='Start timer';break;
case 'export':{const a=document.createElement('a'),blob=new Blob([exportDoc()],{type:'text/html'});a.href=URL.createObjectURL(blob);a.download=fileStem()+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Downloaded. Keep this file.');break}
case 'import':{const inp=document.createElement('input');inp.type='file';inp.accept='.html,.json,text/html,application/json';inp.style.cssText='position:fixed;left:-9999px;width:1px;height:1px;opacity:0';document.body.append(inp);const drop=()=>setTimeout(()=>inp.remove(),0);inp.addEventListener('change',()=>{drop();const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const raw=String(r.result),m=raw.match(/id="restore-data">([\s\S]*?)<\/script>/),data=JSON.parse(m?m[1]:raw),incoming=data.work||data;if(!incoming||typeof incoming!=='object')throw new Error('shape');const w=work();w.notes=Object.assign({},w.notes,incoming.notes||{});w.checks=Object.assign({},w.checks,incoming.checks||{});w.done=[...new Set([...(w.done||[]),...(incoming.done||[])])].filter(n=>n>=1&&n<=8);save();render();toast('Your work is back.')}catch(err){toast('That file could not be read. Use the file this portal downloaded.')}};r.readAsText(f)});inp.addEventListener('cancel',drop);inp.click();break}
case 'profile':{const d=document.createElement('dialog');d.innerHTML=`<form method="dialog"><h2>My work</h2><p>Your name keeps your writing separate on this browser. It is not a private account.</p><label>Your name<input required maxlength="80" value="${profile==='my-work'?'':esc(profile)}"></label><div class="dialog-actions"><button value="cancel" formnovalidate>Cancel</button><button value="save" class="primary">Save and continue</button></div></form>`;document.body.append(d);d.addEventListener('close',()=>{if(d.returnValue==='save'){const value=d.querySelector('input').value.trim();if(value){profile=value;current=Math.min(8,Math.max(1,Number(work().last)||1));group=0;activity=0;save();render()}}d.remove()});d.showModal();break}
}});
document.addEventListener('input',e=>{if(e.target.dataset.note){work().notes[e.target.dataset.note]=e.target.value;document.querySelectorAll('[data-note]').forEach(el=>{if(el!==e.target&&el.dataset.note===e.target.dataset.note)el.value=e.target.value});save()}if(e.target.id==='session-search'){query=e.target.value;$('#module-grid').innerHTML=moduleCards()}});
document.addEventListener('change',e=>{if(e.target.dataset.check){work().checks[e.target.dataset.check]=e.target.checked;save()}});
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||document.querySelector('dialog[open]'))return;if(mode==='Presentation'){if(['Escape','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.key==='Escape'){mode='Learner';render()}if(e.key==='ArrowRight'){slide=Math.min(slides().length-1,slide+1);render()}if(e.key==='ArrowLeft'){slide=Math.max(0,slide-1);render()}}else if(e.key.toLowerCase()==='p'&&nav==='Session'){mode='Presentation';slide=0;render()}});
render();
</script></body></html>
