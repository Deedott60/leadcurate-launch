<body><a class="skip" href="#main">Skip to lesson</a><div id="app"></div><div id="message" role="status" aria-live="polite"></div><script>const DATA={"courses": [{"id": "sales", "label": "Sales career", "description": "From the first interview to your first ninety days", "modules": [{"id": 1, "title": "Getting in", "outputs": "Role map, target role shortlist, sales resume, thirty-second introduction, professional profile, three questions to ask, observed mock cold call, follow-up message."}, {"id": 2, "title": "Offer to day one", "outputs": "Offer review checklist, pre-employment readiness checklist, first-week question list."}, {"id": 3, "title": "The job itself", "outputs": "A prospecting sheet, an account brief, an opener in their own words, a discovery question map, a short presentation, a completed objection sheet, a handoff document."}, {"id": 4, "title": "First 90 days and moving up", "outputs": "A 30, 60 and 90 plan, an accomplishment log started in the room."}], "sessions": [{"id": 1, "module": 1, "title": "The field and the fit", "time": "2 hours", "outcomes": ["Name the main sales roles and say what each one does all day", "Explain how a sales paycheck is built: base, commission, retention", "Say which roles and which work arrangements are realistic for you", "Decide honestly whether this is something you want to pursue"], "topics": [{"id": "1.1", "title": "1.1 Opportunity", "html": "<blockquote>\n<p><strong>\"Nobody cares about your background. If you can work hard, you can perform. You can get\nopportunity.\"<\/strong><\/p>\n<\/blockquote>\n<p>That line is about what happens <strong>once you are on the team.<\/strong> Once you are in, results and effort\nare what people look at. It is not a claim that background never matters while you are applying.<\/p>\n<p>Background here means work history and education.<\/p>\n<p><strong>This is not a promise of getting rich.<\/strong> Nobody gets rich overnight. You can build a very good\nliving, and <strong>six figures is genuinely on the table.<\/strong><\/p>", "quotes": ["<blockquote>\n<p><strong>\"Nobody cares about your background. If you can work hard, you can perform. You can get\nopportunity.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "1.2", "title": "1.2 Benefits beyond the paycheck", "html": "<ul>\n<li><strong>The best insurance you will have in your life.<\/strong> Many places pay full coverage and it does not\n  come out of your check. Some pay 80 percent.<\/li>\n<li>\n<p><strong>Investment culture and financial coaching built in<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Mental health<\/strong> benefits<\/p>\n<\/li>\n<li>\n<p><strong>Health and wellness stipend<\/strong><\/p>\n<\/li>\n<li>\n<p>Health and beauty<\/p>\n<\/li>\n<\/ul>\n<blockquote>\n<p><strong>\"Once your foot is in the door, a lot of these companies are very forward thinking and are about\nyour progress.\"<\/strong><\/p>\n<\/blockquote>", "quotes": ["<blockquote>\n<p><strong>\"Once your foot is in the door, a lot of these companies are very forward thinking and are about\nyour progress.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "1.3", "title": "1.3 What the job actually is", "html": "<blockquote>\n<p><strong>\"For the most part, you're a business consultant. Where you work, you're the expert on the\nknowledge.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Regardless of who is on the other end<\/strong>. calm, rude, overtalking, quiet, or an authority figure.<\/p>\n<blockquote>\n<p><strong>\"When you carry yourself as such, people treat you as such.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>And:<\/strong> you will be surprised how many people lean on you and take in what you say, even when they\ndo not act like it.<\/p>\n<p><strong>Which is why product knowledge matters.<\/strong> Immerse yourself in what you are selling. Knowledge is\nwhat makes you the authority, not tone or technique.<\/p>", "quotes": ["<blockquote>\n<p><strong>\"For the most part, you're a business consultant. Where you work, you're the expert on the\nknowledge.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"When you carry yourself as such, people treat you as such.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "1.4", "title": "1.4 Inside, outside, hybrid, remote", "html": "<ul>\n<li><strong>Inside sales.<\/strong> Phone, video, email, CRM.<\/li>\n<li><strong>Outside sales.<\/strong> Travel, in person. Typically good relationship builders. Comes with travel and\n  gas stipends.<\/li>\n<li><strong>Hybrid is common now.<\/strong> Three days home, two days in office.<\/li>\n<li><strong>Fully remote is common and there are a ton of remote opportunities.<\/strong> If the company is in\n  California and you are not, remote is the model.<\/li>\n<\/ul>\n<p><strong>Why this matters for a career center: remote removes the transportation barrier.<\/strong><\/p>\n<p><strong>DoorDash was a hybrid of both.<\/strong> <em>\"You had to hit the ground running or you\nwouldn't have made it a month.\"<\/em><\/p>", "quotes": []}, {"id": "1.5", "title": "1.5 The roles", "html": "<ul>\n<li><strong>SDR and BDR.<\/strong> The best door in <strong>and the best teacher<\/strong>, because you do everything except close.\n  Roughly <strong>75 percent of the heavy lifting<\/strong>: outreach, building and managing pipeline, nurturing,\n  first objections, gatekeepers.<\/li>\n<li><strong>Account Executive.<\/strong> Runs the process and closes. I came in directly as an AE.<\/li>\n<li><strong>Senior AE and Strategic AE.<\/strong> Bigger accounts. <strong>Base pay climbs tremendously<\/strong>. $75,000, $80,000\n  or more before commission.<\/li>\n<li>\n<p><strong>Account Manager and Partner Management.<\/strong> You are assigned a book of business. Keep the customer\n  first and happy. <em>\"You're a go-between. You're hired to be a go-between.\"<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Customer Success. Onboarding. Sales Operations.<\/strong><\/p>\n<\/li>\n<\/ul>\n<p><strong>Titles differ company to company. Read the job description, not the title.<\/strong><\/p>", "quotes": []}, {"id": "1.6", "title": "1.6 Company type changes everything", "html": "<ul>\n<li><strong>Startups<\/strong> may have no SDR role at all. Training is trial by fire. They usually want experience\n  already. Good fit for somebody self-motivated who works alone well.<\/li>\n<li><strong>Bigger companies will often take a chance on less experience<\/strong>. the opposite of what people\n  assume. <strong>Benefits usually start day one, no probationary wait.<\/strong> Tradeoff is more structure and\n  more oversight.<\/li>\n<\/ul>", "quotes": []}, {"id": "1.7", "title": "1.7 How the money actually works", "html": "<p><em>From my own experience. The pay structure depends on where you work.<\/em><\/p>\n<p><strong>My numbers, not a textbook.<\/strong><\/p>\n<p><strong>Entry base:<\/strong> roughly <strong>$35,000 to $45,000<\/strong> a year.<\/p>\n<p><strong>Then incentives on top:<\/strong><\/p>\n<ul>\n<li>\n<p>Some pay <strong>every two weeks<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Most pay monthly<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Some SDR and BDR roles pay quarterly<\/strong><\/p>\n<\/li>\n<\/ul>\n<p><strong>RETENTION. the third check.<\/strong><\/p>\n<blockquote>\n<p><strong>\"Most places you are required to keep your retention at a certain level. Retention is big.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>There are three checks, not two:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>My real example, one month<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Base pay<\/td>\n<td>$27.50 per hour<\/td>\n<\/tr>\n<tr>\n<td><strong>Retention check<\/strong><\/td>\n<td><strong>$1,800<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Commission check<\/td>\n<td>$4,200<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How retention works:<\/strong> sell a customer who stays for an extended period and it accumulates. At\n<strong>85 percent retention<\/strong> I might get back <strong>30 percent of my contracted accounts<\/strong>, paid on\naccounts from the last three months that held at a threshold.<\/p>\n<p><strong>The third check is the one that rewards selling the <em>right<\/em> customer instead of any customer.<\/strong><\/p>\n<p><strong>Draw, as I actually experienced it. Not a debt trap:<\/strong>\nSome roles pay your <strong>estimated commission up front for the first 90 days.<\/strong> Example: base averages\n$27.50 per hour, estimated commission at goal is $2,700 monthly, you get that $2,700 as a draw for 90\ndays. <strong>The goal is to exceed your draw.<\/strong><\/p>\n<p>Clawback exists. I never had one, and most places I worked did not use them. Ask whether the company\nhas one and how it works before you sign.<\/p>", "quotes": ["<blockquote>\n<p><strong>\"Most places you are required to keep your retention at a certain level. Retention is big.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "1.8", "title": "1.8 What \"goal\" means", "html": "<ul>\n<li>\n<p><strong>Usually monthly. Some places biweekly.<\/strong><\/p>\n<\/li>\n<li>\n<p>Goal can be <strong>a number of accounts signed, or a dollar amount.<\/strong><\/p>\n<\/li>\n<\/ul>\n<blockquote>\n<p><strong>At Angi it was $30,000 every two weeks in contracts signed.<\/strong><\/p>\n<\/blockquote>\n<p><strong>Other places measure differently:<\/strong><\/p>\n<ul>\n<li><strong>How many people you get onboarded<\/strong>, when there is no money up front<\/li>\n<li>\n<p>Some products take <strong>thousands, even $20,000 up front<\/strong><\/p>\n<\/li>\n<li>\n<p>Others take <strong>nothing up front and bill on the back end<\/strong><\/p>\n<\/li>\n<\/ul>\n<p><strong>How the company gets paid determines what you get measured on. That is worth asking about in the\ninterview.<\/strong><\/p>", "quotes": ["<blockquote>\n<p><strong>At Angi it was $30,000 every two weeks in contracts signed.<\/strong><\/p>\n<\/blockquote>"]}, {"id": "1.9", "title": "1.9 KPIs", "html": "<p><strong>Daily activity varies, and some of it is unreasonable.<\/strong><\/p>\n<ul>\n<li>\n<p><strong>200 touch points a day<\/strong>, or <strong>150+ dials a day<\/strong><\/p>\n<\/li>\n<li>\n<p>Some shops <strong>double dial<\/strong>, some do not<\/p>\n<\/li>\n<\/ul>\n<p><strong>Where the numbers live:<\/strong> the CRM. You can see your touch points across the week.<\/p>\n<p><strong>Before you close something lost, check your touch point count.<\/strong><\/p>\n<p><strong>The judgment part, which is not a number:<\/strong> qualifying the right prospects, <strong>disqualifying the\nwrong ones<\/strong>, and learning when to move on. That comes from practice, not a rule.<\/p>", "quotes": []}, {"id": "1.10", "title": "1.10 The fit conversation", "html": "<p><strong>Not \"are you the right type of person.\"<\/strong><\/p>\n<blockquote>\n<p><strong>\"It does not single you out\"<\/strong>. not for your belief system, not for where you are from, not for\nhow you sound.<\/p>\n<\/blockquote>\n<p><strong>The accent story.<\/strong> I worried about my southern accent while working New York, California\nand Midwest accounts.<\/p>\n<blockquote>\n<p><strong>My manager told me it became my strongest weapon.<\/strong><\/p>\n<p><strong>\"Anything about your personality can be used, can be a positive at the end of the day.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>The honest part:<\/strong><\/p>\n<ul>\n<li>\n<p>You take rejection. <strong>Do not take it personally.<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>You are going to fail every day.<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>When you win, it is well worth it.<\/strong><\/p>\n<\/li>\n<\/ul>\n<blockquote>\n<p><strong>\"When I say fit, I almost say fail. You learn lessons about yourself in sales. what you can\ntolerate, what you can't.\"<\/strong><\/p>\n<\/blockquote>", "quotes": ["<blockquote>\n<p><strong>\"It does not single you out\"<\/strong>. not for your belief system, not for where you are from, not for\nhow you sound.<\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>My manager told me it became my strongest weapon.<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Anything about your personality can be used, can be a positive at the end of the day.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"When I say fit, I almost say fail. You learn lessons about yourself in sales. what you can\ntolerate, what you can't.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "1.11", "title": "1.11 How you get somebody to pick up the phone", "html": "<blockquote>\n<p><strong>\"A stranger telling you no never hurt anybody. You aren't losing anything in the conversation.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>And the real answer is volume, not talent:<\/strong><\/p>\n<blockquote>\n<p><strong>\"A lot of the sales reps that are successful aren't necessarily the best at sales. They have the\nmost outreach.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Seasonality is real.<\/strong> Holidays are slower. Different times of day perform differently. You make up\nfor the slow stretches.<\/p>\n<p><strong>On objections, early:<\/strong> people throw them constantly. no money, not now, not interested.<\/p>\n<blockquote>\n<p><strong>\"People spend money on things they see value in and they want.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>And the part worth holding on to:<\/strong><\/p>\n<blockquote>\n<p><strong>\"I still get nervous hopping on the phone calling somebody. I don't think that ever goes away.\"<\/strong><\/p>\n<p><strong>\"Once you get a couple wins, you see why it's worth it.\"<\/strong><\/p>\n<\/blockquote>", "quotes": ["<blockquote>\n<p><strong>\"A stranger telling you no never hurt anybody. You aren't losing anything in the conversation.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"A lot of the sales reps that are successful aren't necessarily the best at sales. They have the\nmost outreach.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"People spend money on things they see value in and they want.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"I still get nervous hopping on the phone calling somebody. I don't think that ever goes away.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Once you get a couple wins, you see why it's worth it.\"<\/strong><\/p>\n<\/blockquote>"]}], "examples": [{"id": "1.10", "title": "1.10 The fit conversation", "html": "<p><strong>Not \"are you the right type of person.\"<\/strong><\/p>\n<blockquote>\n<p><strong>\"It does not single you out\"<\/strong>. not for your belief system, not for where you are from, not for\nhow you sound.<\/p>\n<\/blockquote>\n<p><strong>The accent story.<\/strong> I worried about my southern accent while working New York, California\nand Midwest accounts.<\/p>\n<blockquote>\n<p><strong>My manager told me it became my strongest weapon.<\/strong><\/p>\n<p><strong>\"Anything about your personality can be used, can be a positive at the end of the day.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>The honest part:<\/strong><\/p>\n<ul>\n<li>\n<p>You take rejection. <strong>Do not take it personally.<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>You are going to fail every day.<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>When you win, it is well worth it.<\/strong><\/p>\n<\/li>\n<\/ul>\n<blockquote>\n<p><strong>\"When I say fit, I almost say fail. You learn lessons about yourself in sales. what you can\ntolerate, what you can't.\"<\/strong><\/p>\n<\/blockquote>", "quotes": ["<blockquote>\n<p><strong>\"It does not single you out\"<\/strong>. not for your belief system, not for where you are from, not for\nhow you sound.<\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>My manager told me it became my strongest weapon.<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Anything about your personality can be used, can be a positive at the end of the day.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"When I say fit, I almost say fail. You learn lessons about yourself in sales. what you can\ntolerate, what you can't.\"<\/strong><\/p>\n<\/blockquote>"]}], "quote": "<blockquote>\n<p><strong>\"A stranger telling you no never hurt anybody. You aren't losing anything in the conversation.\"<\/strong><\/p>\n<\/blockquote>", "activities": "<ol>\n<li><strong>Job posting teardown.<\/strong> Three real postings for the same title from three companies. Compare\n   what is actually required versus marketing language.<\/li>\n<li><strong>Paycheck math.<\/strong> Given a base, a goal and a retention rate, build all three checks.<\/li>\n<li><strong>Fit reflection.<\/strong> Private, kept by the participant, not collected.<\/li>\n<\/ol>", "ai": "<p>Researching real job postings, comparing how three companies describe the same role, and putting\nunfamiliar comp language into plain terms. <strong>Participant verifies everything.<\/strong><\/p>", "pages": ["16C"]}, {"id": 2, "module": 1, "title": "Positioning yourself", "time": "2 hours", "outcomes": ["Find the evidence in your own work history that counts for sales", "Write a resume that gets past an automated filter", "Say who you are in thirty seconds without a script", "Explain why your trade background is an advantage, not a gap"], "topics": [{"id": "2.1", "title": "2.1 The frame", "html": "<p><strong>Prioritize the skills where you dealt with customers daily, at high volume.<\/strong><\/p>\n<blockquote>\n<p><strong>\"And it's not lying on a resume.\"<\/strong><\/p>\n<\/blockquote>\n<p>Nothing is being dressed up. You are prioritizing what is already true.<\/p>", "quotes": ["<blockquote>\n<p><strong>\"And it's not lying on a resume.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "2.2", "title": "2.2 Who is already good at this and does not know it", "html": "<p><strong>Restaurant clerk. Hostess. Waitress.<\/strong><\/p>\n<blockquote>\n<p><strong>\"A lot of those people tend to do really well in sales because of their temperament, dealing\nwith people.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Why:<\/strong> you are dealing with people at some of the <strong>least opportune times.<\/strong> Hungry, waiting,\nannoyed. Same muscle.<\/p>\n<p><strong>Anything customer facing transfers<\/strong> into sales, customer service, and onboarding.<\/p>\n<blockquote>\n<p><strong>\"Sometimes the sales and customer service lines get blurred a bit, and onboarding and sales kind\nof get blurred a good bit.\"<\/strong><\/p>\n<\/blockquote>", "quotes": ["<blockquote>\n<p><strong>\"A lot of those people tend to do really well in sales because of their temperament, dealing\nwith people.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Sometimes the sales and customer service lines get blurred a bit, and onboarding and sales kind\nof get blurred a good bit.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "2.3", "title": "2.3 The trade and service industry background", "html": "<p>Somebody whose whole history is warehouse, construction, landscaping, roofing, cleaning:<\/p>\n<blockquote>\n<p><strong>\"Those have a ton of value.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>What to pull off that history:<\/strong><\/p>\n<ul>\n<li><strong>Crew lead.<\/strong> Managing people. Keeping people moving.<\/li>\n<li>\n<p><strong>Running multiple jobs at once<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Dealing with homeowners directly<\/strong><\/p>\n<\/li>\n<\/ul>\n<p><strong>And here is the part that matters most for you.<\/strong> A huge number of these roles sell <strong>to the\nservice industry.<\/strong><\/p>\n<ul>\n<li>\n<p>Talking to a roofer and <strong>knowing what they charge a square<\/strong><\/p>\n<\/li>\n<li>\n<p>Talking to a gutter company and <strong>knowing what gutters they run<\/strong><\/p>\n<\/li>\n<li>\n<p>Talking to a cleaning company when <strong>you worked for one or ran one on the side<\/strong><\/p>\n<\/li>\n<\/ul>\n<blockquote>\n<p><strong>\"Most of your real world experience, especially people in the service industry, that's going to\ntranslate over immediately. You're going to feel right at home.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Your trade background is domain knowledge the rep sitting next to you does not have.<\/strong><\/p>", "quotes": ["<blockquote>\n<p><strong>\"Those have a ton of value.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Most of your real world experience, especially people in the service industry, that's going to\ntranslate over immediately. You're going to feel right at home.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "2.4", "title": "2.4 The DoorDash lesson", "html": "<p>I had never used DoorDash before working there. People who had used it picked up the lingo\nfaster. <strong>Not that it cannot be learned<\/strong>. but knowing a product from the customer side is a real\nhead start. Apply where your life already gave you knowledge.<\/p>", "quotes": []}, {"id": "2.5", "title": "2.5 ATS and actually applying", "html": "<p><strong>Workday, Greenhouse and similar filter resumes before a human sees anything. They filter on\nkeywords.<\/strong><\/p>\n<p><strong>So:<\/strong><\/p>\n<ol>\n<li>\n<p><strong>Read the job description<\/strong><\/p>\n<\/li>\n<li>\n<p>Cross reference it against <strong>what you have actually done<\/strong><\/p>\n<\/li>\n<li>\n<p>Look for: examples of that work, <strong>software you have used, classes or cohorts you have taken,\n   anything you have been part of that resembles it<\/strong><\/p>\n<\/li>\n<\/ol>\n<p><strong>The mistake people make:<\/strong><\/p>\n<blockquote>\n<p>A designed resume with colors and a profile picture <strong>looks good in a physical human being's\nhand.<\/strong> But the scanner is only reading words.<\/p>\n<p><strong>\"Technically computers don't read words, they read numbers.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>The design is pulling the scanner away from what it should be reading.<\/strong><\/p>\n<p><strong>And:<\/strong> you are competing against AI on the other side of that funnel.<\/p>", "quotes": ["<blockquote>\n<p>A designed resume with colors and a profile picture <strong>looks good in a physical human being's\nhand.<\/strong> But the scanner is only reading words.<\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Technically computers don't read words, they read numbers.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "2.6", "title": "2.6 \"Tell me about yourself\". thirty seconds", "html": "<p><strong>What goes in:<\/strong> who you actually are, a little personality, <strong>the truth<\/strong>, your family if that is\npart of it, <strong>your goals<\/strong>, then <strong>ask what is expected of you.<\/strong><\/p>\n<blockquote>\n<p><strong>\"Just be a real person. That's what they're looking for.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Why it works:<\/strong><\/p>\n<blockquote>\n<p><strong>\"Who you show up to work as every day is who they want to actually meet.\"<\/strong><\/p>\n<p><strong>\"Recruiters want to know who they're sending to somebody. They don't want to send four different\npeople, and it's the same person with four different personalities.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>The recruiter is staking their name on you.<\/strong> They need to know which version shows up.<\/p>", "quotes": ["<blockquote>\n<p><strong>\"Just be a real person. That's what they're looking for.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Who you show up to work as every day is who they want to actually meet.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Recruiters want to know who they're sending to somebody. They don't want to send four different\npeople, and it's the same person with four different personalities.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "2.7", "title": "2.7 LinkedIn", "html": "<p><strong>My position: it is not overrated.<\/strong> People do not want to do it. Do it anyway.<\/p>\n<p><strong>What it has actually produced for me:<\/strong> references, <strong>recruiters reaching out regularly without\nme ever contacting their company<\/strong>, conversations, reviews.<\/p>\n<blockquote>\n<p><strong>\"It's building a digital profile, professionally.\"<\/strong><\/p>\n<\/blockquote>", "quotes": ["<blockquote>\n<p><strong>\"It's building a digital profile, professionally.\"<\/strong><\/p>\n<\/blockquote>"]}], "examples": [{"id": "2.3", "title": "2.3 The trade and service industry background", "html": "<p>Somebody whose whole history is warehouse, construction, landscaping, roofing, cleaning:<\/p>\n<blockquote>\n<p><strong>\"Those have a ton of value.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>What to pull off that history:<\/strong><\/p>\n<ul>\n<li><strong>Crew lead.<\/strong> Managing people. Keeping people moving.<\/li>\n<li>\n<p><strong>Running multiple jobs at once<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Dealing with homeowners directly<\/strong><\/p>\n<\/li>\n<\/ul>\n<p><strong>And here is the part that matters most for you.<\/strong> A huge number of these roles sell <strong>to the\nservice industry.<\/strong><\/p>\n<ul>\n<li>\n<p>Talking to a roofer and <strong>knowing what they charge a square<\/strong><\/p>\n<\/li>\n<li>\n<p>Talking to a gutter company and <strong>knowing what gutters they run<\/strong><\/p>\n<\/li>\n<li>\n<p>Talking to a cleaning company when <strong>you worked for one or ran one on the side<\/strong><\/p>\n<\/li>\n<\/ul>\n<blockquote>\n<p><strong>\"Most of your real world experience, especially people in the service industry, that's going to\ntranslate over immediately. You're going to feel right at home.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Your trade background is domain knowledge the rep sitting next to you does not have.<\/strong><\/p>", "quotes": ["<blockquote>\n<p><strong>\"Those have a ton of value.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Most of your real world experience, especially people in the service industry, that's going to\ntranslate over immediately. You're going to feel right at home.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "2.4", "title": "2.4 The DoorDash lesson", "html": "<p>I had never used DoorDash before working there. People who had used it picked up the lingo\nfaster. <strong>Not that it cannot be learned<\/strong>. but knowing a product from the customer side is a real\nhead start. Apply where your life already gave you knowledge.<\/p>", "quotes": []}], "quote": "<blockquote>\n<p><strong>\"It's building a digital profile, professionally.\"<\/strong><\/p>\n<\/blockquote>", "activities": "<ol>\n<li><strong>Evidence inventory.<\/strong> Before writing anything, list every job and pull out what is measurable\n   or notable. Group work, because people undersell themselves.<\/li>\n<li><strong>Build the resume.<\/strong> AI-assisted drafting, then verify every claim by hand.<\/li>\n<li><strong>Thirty seconds out loud<\/strong>, to one other person, with one piece of feedback back.<\/li>\n<\/ol>", "ai": "<p>Drafting and tightening resume language, tailoring to a posting, rewriting duties as\naccomplishments. <strong>Then the verification pass: every date, title and number checked by hand.<\/strong><\/p>", "pages": ["17"]}, {"id": 3, "module": 1, "title": "The interview chain", "time": "2 to 2.5 hours", "outcomes": ["Describe the interview chain and say who you will actually work with day to day", "Ask three questions that make you look ready instead of worried", "Run a mock cold call and keep it moving under pressure", "Send a follow-up that lands"], "topics": [{"id": "3.1", "title": "3.1 The chain", "html": "<ul>\n<li>\n<p><strong>Recruiter screen, about 30 minutes.<\/strong> Mostly personality. Your experience, how you approach the\n  job, how you heard about them. Metrics and expectations of the role. <strong>Pay comes up.<\/strong> Ends with\n  <em>\"we'll pass this along, we'll be in touch.\"<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Hiring manager.<\/strong> Reports back on what happened with you.<\/p>\n<\/li>\n<li><strong>Team lead<\/strong>, typically.<\/li>\n<li><strong>Sales leadership or a director<\/strong>, depending on company and role.<\/li>\n<\/ul>", "quotes": []}, {"id": "3.2", "title": "3.2 What they are all actually testing", "html": "<p>It is easy to assume each stage wants something different and that candidates lose it in round two by\nrepeating themselves. <strong>That is not how I experienced it.<\/strong><\/p>\n<blockquote>\n<p><strong>\"They're pretty much testing the same thing. Everybody just wants to see where your head is.\nIs this something you're ready to dig into?\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>All of them are looking at:<\/strong><\/p>\n<ul>\n<li>Where your head is<\/li>\n<li><strong>Your personality<\/strong>, at every stage<\/li>\n<li><strong>Most of these roles are honest about the tough parts of the job.<\/strong> They tell you.<\/li>\n<\/ul>", "quotes": ["<blockquote>\n<p><strong>\"They're pretty much testing the same thing. Everybody just wants to see where your head is.\nIs this something you're ready to dig into?\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "3.3", "title": "3.3 But the stages are not interchangeable. because of who you will work with", "html": "<ul>\n<li><strong>The team lead is who you will actually deal with when you have issues, especially early.<\/strong> Not\n  the manager.<\/li>\n<li>\n<p><strong>Why:<\/strong> managers are spread thin. A manager may carry <strong>8 to 14 people.<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>The team lead is usually in training to become a manager<\/strong>. putting time in, taking a leadership\n  development course.<\/p>\n<\/li>\n<\/ul>\n<p><strong>When you meet the team lead, you are meeting your day-to-day person. Build rapport there, not just\nwith the biggest title.<\/strong><\/p>", "quotes": []}, {"id": "3.4", "title": "3.4 When the conversation opens another door", "html": "<blockquote>\n<p><strong>Sometimes in the interview you'll get offered a different position, just off the conversation\nand how they feel about you.<\/strong><\/p>\n<\/blockquote>\n<ul>\n<li>\n<p>They may tell you about <strong>other roles that are open<\/strong><\/p>\n<\/li>\n<li>\n<p>It could be <strong>somewhat of a promotion<\/strong> over what you applied for<\/p>\n<\/li>\n<li>Or a role already filled where <strong>they still feel like they have a place for you<\/strong><\/li>\n<\/ul>\n<p><strong>Which is the argument for the whole approach:<\/strong> let your personality show and know something about\nthe role. That is what opens a door you did not apply to.<\/p>", "quotes": ["<blockquote>\n<p><strong>Sometimes in the interview you'll get offered a different position, just off the conversation\nand how they feel about you.<\/strong><\/p>\n<\/blockquote>"]}, {"id": "3.5", "title": "3.5 The three questions you ask", "html": "<p><strong>1. \"What does a successful 30, 60 and 90 days look like in this role?\"<\/strong>\nAsk anyone. Works with the recruiter. Tells you whether they have a real ramp plan.<\/p>\n<p><strong>2. \"What do the top performers do consistently here?\"<\/strong>\n<strong>Ask the team lead or hiring manager, not the recruiter.<\/strong> The recruiter does not know. The team\nlead works the floor.<\/p>\n<p><strong>3. \"What are the top three things I can do coming in to really set myself apart?\"<\/strong>\nAsk the hiring manager or team lead. Forward leaning. Says <em>I plan to be good at this.<\/em><\/p>\n<p><strong>Match the question to the person:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Who<\/th>\n<th>What they can actually answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Recruiter<\/td>\n<td>Process, timeline, comp basics, ramp structure<\/td>\n<\/tr>\n<tr>\n<td>Hiring manager<\/td>\n<td>Expectations, what sets people apart, team dynamics<\/td>\n<\/tr>\n<tr>\n<td>Team lead<\/td>\n<td>What top performers actually do, what the day is really like<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Not asking anything is disqualifying.<\/strong><\/p>\n<blockquote>\n<p><strong>\"Some people don't always ask questions, and they always seem shocked that I actually asked a\nquestion.\"<\/strong><\/p>\n<\/blockquote>", "quotes": ["<blockquote>\n<p><strong>\"Some people don't always ask questions, and they always seem shocked that I actually asked a\nquestion.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "3.6", "title": "3.6 The mock cold call", "html": "<p><strong>They email you about an imaginary customer, give you company information, you research it on your\nown, then run the call live in one of the interviews.<\/strong><\/p>\n<p><strong>What they are actually grading:<\/strong><\/p>\n<blockquote>\n<p><strong>\"They just want to see that you understand the flow of a sales conversation. That's really,\nreally it.\"<\/strong><\/p>\n<\/blockquote>\n<ol>\n<li>\n<p><strong>Do you know how to open a call<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Do you know an objection when you hear one.<\/strong> They will throw one at you early. \"I'm busy.\"\n   \"I've got another prospect on the line.\" That is not the interviewer being rude to you. That is\n   the test.<\/p>\n<\/li>\n<li><strong>Can you handle it and keep the call moving<\/strong>, or do you go stagnant and get stuck<\/li>\n<li>\n<p><strong>Can you ease from \"don't bother me\" into discovery<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Can you get to a trial close.<\/strong> My example: <em>\"If we can come up with a solution for this, this\n   and that, is that something you'd be ready to move forward with today?\"<\/em><\/p>\n<\/li>\n<\/ol>\n<h3>Objection handling is what they are watching for<\/h3>\n<p>This is the part of the mock call people fail, and it is the part of the job you do every single day.\nAn objection is not a rejection and it is not a closed door. It is the customer telling you something\nbefore they are ready to say it plainly.<\/p>\n<p><strong>For the interview you need the early one, the one that lands in the first ten seconds.<\/strong> Do not\nargue with it and do not speed up. Acknowledge it, stay calm, ask one question, and keep moving.<\/p>\n<blockquote>\n<p><strong>\"Hey, I know you're busy. That's actually why I'm calling. Can I ask you one quick question?\"<\/strong><\/p>\n<\/blockquote>\n<p>Session 7 covers the four objections you will hear most once you are in the job, and how to loop\nthrough them at the close. In the interview, nobody expects that depth. They want to see that you\nknow what an objection is and that it does not stop you.<\/p>\n<blockquote>\n<p><strong>\"You don't have to get everything right or perfect. They want to see that you know how to move a\ncall along.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>This is the rubric. Movement, not polish.<\/strong><\/p>", "quotes": ["<blockquote>\n<p><strong>\"They just want to see that you understand the flow of a sales conversation. That's really,\nreally it.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Hey, I know you're busy. That's actually why I'm calling. Can I ask you one quick question?\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"You don't have to get everything right or perfect. They want to see that you know how to move a\ncall along.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "3.7", "title": "3.7 Following up", "html": "<ul>\n<li>\n<p><strong>Next morning or that same evening.<\/strong> Text or email <strong>to the recruiter.<\/strong><\/p>\n<\/li>\n<li>\n<p>Roughly: <em>thank you again for connecting me, it was a pleasure speaking with [name].<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Interviews come fast, back to back.<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>The recruiter usually reaches out soon<\/strong>, especially if they are moving forward.<\/p>\n<\/li>\n<\/ul>", "quotes": []}], "examples": [{"id": "3.4", "title": "3.4 When the conversation opens another door", "html": "<blockquote>\n<p><strong>Sometimes in the interview you'll get offered a different position, just off the conversation\nand how they feel about you.<\/strong><\/p>\n<\/blockquote>\n<ul>\n<li>\n<p>They may tell you about <strong>other roles that are open<\/strong><\/p>\n<\/li>\n<li>\n<p>It could be <strong>somewhat of a promotion<\/strong> over what you applied for<\/p>\n<\/li>\n<li>Or a role already filled where <strong>they still feel like they have a place for you<\/strong><\/li>\n<\/ul>\n<p><strong>Which is the argument for the whole approach:<\/strong> let your personality show and know something about\nthe role. That is what opens a door you did not apply to.<\/p>", "quotes": ["<blockquote>\n<p><strong>Sometimes in the interview you'll get offered a different position, just off the conversation\nand how they feel about you.<\/strong><\/p>\n<\/blockquote>"]}, {"id": "3.6", "title": "3.6 The mock cold call", "html": "<p><strong>They email you about an imaginary customer, give you company information, you research it on your\nown, then run the call live in one of the interviews.<\/strong><\/p>\n<p><strong>What they are actually grading:<\/strong><\/p>\n<blockquote>\n<p><strong>\"They just want to see that you understand the flow of a sales conversation. That's really,\nreally it.\"<\/strong><\/p>\n<\/blockquote>\n<ol>\n<li>\n<p><strong>Do you know how to open a call<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Do you know an objection when you hear one.<\/strong> They will throw one at you early. \"I'm busy.\"\n   \"I've got another prospect on the line.\" That is not the interviewer being rude to you. That is\n   the test.<\/p>\n<\/li>\n<li><strong>Can you handle it and keep the call moving<\/strong>, or do you go stagnant and get stuck<\/li>\n<li>\n<p><strong>Can you ease from \"don't bother me\" into discovery<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Can you get to a trial close.<\/strong> My example: <em>\"If we can come up with a solution for this, this\n   and that, is that something you'd be ready to move forward with today?\"<\/em><\/p>\n<\/li>\n<\/ol>\n<h3>Objection handling is what they are watching for<\/h3>\n<p>This is the part of the mock call people fail, and it is the part of the job you do every single day.\nAn objection is not a rejection and it is not a closed door. It is the customer telling you something\nbefore they are ready to say it plainly.<\/p>\n<p><strong>For the interview you need the early one, the one that lands in the first ten seconds.<\/strong> Do not\nargue with it and do not speed up. Acknowledge it, stay calm, ask one question, and keep moving.<\/p>\n<blockquote>\n<p><strong>\"Hey, I know you're busy. That's actually why I'm calling. Can I ask you one quick question?\"<\/strong><\/p>\n<\/blockquote>\n<p>Session 7 covers the four objections you will hear most once you are in the job, and how to loop\nthrough them at the close. In the interview, nobody expects that depth. They want to see that you\nknow what an objection is and that it does not stop you.<\/p>\n<blockquote>\n<p><strong>\"You don't have to get everything right or perfect. They want to see that you know how to move a\ncall along.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>This is the rubric. Movement, not polish.<\/strong><\/p>", "quotes": ["<blockquote>\n<p><strong>\"They just want to see that you understand the flow of a sales conversation. That's really,\nreally it.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Hey, I know you're busy. That's actually why I'm calling. Can I ask you one quick question?\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"You don't have to get everything right or perfect. They want to see that you know how to move a\ncall along.\"<\/strong><\/p>\n<\/blockquote>"]}], "quote": "<blockquote>\n<p><strong>\"They just want to see that you understand the flow of a sales conversation. That's really,\nreally it.\"<\/strong><\/p>\n<\/blockquote>", "activities": "<ol>\n<li><strong>Question prep.<\/strong> The three questions, written out, matched to who they will ask.<\/li>\n<li>\n<p><strong>Mock cold call, observed and scored. Everybody does one.<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Follow-up draft.<\/strong><\/p>\n<\/li>\n<\/ol>", "ai": "<p>Company research before the call. <strong>AI plays the interviewer<\/strong> for each stage. Practicing pressure\nquestions until the answer is calm. Drafting follow-up, then editing it to sound human.<\/p>", "pages": ["2", "4", "16C"]}, {"id": 4, "module": 2, "title": "From the offer to your first week", "time": "2 to 2.5 hours", "outcomes": ["Read an offer letter and explain every part of the pay", "Explain what retention is and why it is a third paycheck", "Describe what happens between signing and your first day", "Name what you will need ready before you start"], "topics": [{"id": "4.1", "title": "4.1 What to actually look at", "html": "<p><strong>My own list, in my order:<\/strong><\/p>\n<ul>\n<li>\n<p><strong>Your pay and the structure of it<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Insurance package and benefits<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Stipends<\/strong>. more of these exist than people expect:<\/p>\n<\/li>\n<li>Health and wellness<\/li>\n<li><strong>Internet stipend if the role is remote<\/strong><\/li>\n<li>\n<p><strong>Travel stipends<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>When it starts and when it is active<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Onboarding materials and paperwork.<\/strong> W-2s and similar. <strong>Most of that is handled before you\n  start.<\/strong><\/p>\n<\/li>\n<\/ul>", "quotes": []}, {"id": "4.2", "title": "4.2 The pay, broken down", "html": "<p><em>From my own experience. The pay structure depends on where you work.<\/em><\/p>\n<h3>Base<\/h3>\n<p>What you get regardless. Entry roles run roughly <strong>$35,000 to $45,000<\/strong> a year. Ranges vary by\nemployer and by market.<\/p>\n<h3>Commission<\/h3>\n<ul>\n<li>\n<p>Some companies pay <strong>every two weeks<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Most pay monthly<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Some SDR and BDR roles pay quarterly<\/strong><\/p>\n<\/li>\n<\/ul>\n<h3>RETENTION. the third check<\/h3>\n<blockquote>\n<p><strong>\"Most places you are required to keep your retention at a certain level. Retention is big.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>How it works:<\/strong> sell a customer who stays for an extended period and it accumulates. At <strong>85\npercent retention<\/strong> I might get back <strong>30 percent of my contracted accounts<\/strong>, paid on\naccounts from the last three months that held at a threshold.<\/p>\n<p><strong>So there are three checks, not two. My real example of one month:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Component<\/th>\n<th>Amount<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Base pay<\/td>\n<td>$27.50 per hour<\/td>\n<\/tr>\n<tr>\n<td><strong>Retention check<\/strong><\/td>\n<td><strong>$1,800<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Commission check<\/td>\n<td>$4,200<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>\"Depending on where you work, you get your base pay, you get your commission, and you can also\nget a retention check.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>The retention check is what rewards selling the right customer instead of any customer.<\/strong> It is the\nmoney reason to qualify properly, which is what Module 3 teaches.<\/p>\n<h3>Draw, as it actually works<\/h3>\n<p><strong>Not a debt trap. An up-front estimate during ramp.<\/strong><\/p>\n<p>Some roles pay your <strong>estimated commission up front for the first 90 days.<\/strong><\/p>\n<p><strong>My real example:<\/strong> base averages <strong>$27.50 per hour<\/strong>, estimated commission at goal is <strong>$2,700\nmonthly<\/strong>, and you receive that $2,700 as a draw for the first 90 days.<\/p>\n<blockquote>\n<p><strong>\"The goal is to exceed your monthly draw.\"<\/strong><\/p>\n<\/blockquote>\n<h3>Clawback<\/h3>\n<p>Clawback exists. I never had one, and most places I worked did not use them. Ask whether the company\nhas one and how it works before you sign.<\/p>\n<blockquote>\n<p><strong>\"I never had any drawbacks, thank God. And a lot of places I worked for really didn't have them,\neven though they do exist.\"<\/strong><\/p>\n<\/blockquote>", "quotes": ["<blockquote>\n<p><strong>\"Most places you are required to keep your retention at a certain level. Retention is big.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Depending on where you work, you get your base pay, you get your commission, and you can also\nget a retention check.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"The goal is to exceed your monthly draw.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"I never had any drawbacks, thank God. And a lot of places I worked for really didn't have them,\neven though they do exist.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "4.3", "title": "4.3 Benefits timing", "html": "<p><strong>Bigger companies often start benefits day one with no probationary wait.<\/strong> Startups and smaller\ncompanies may make you wait. <strong>Ask when coverage starts. The answer changes what the offer is worth in the first few months.<\/strong><\/p>", "quotes": []}, {"id": "4.4", "title": "4.4 What is negotiable", "html": "<p>Start date, base within a band, sometimes a sign-on. <strong>Not<\/strong> the commission plan structure, the\nbenefits package, or the quota.<\/p>\n<p><strong>The honest note:<\/strong> for a first sales job the leverage is low. <strong>Getting in matters more than\nsqueezing the offer.<\/strong> Say this plainly.<\/p>", "quotes": []}, {"id": "4.5", "title": "4.5 Between signing and day one", "html": "<p><strong>The sequence, as I lived it. Teach it in this order.<\/strong><\/p>\n<ol>\n<li><strong>Equipment ships to your house.<\/strong> MacBook or Lenovo. Sometimes a monitor and headset.<\/li>\n<li><strong>Account setup arrives by email.<\/strong> <strong>Okta<\/strong> or similar single sign-on. <strong>ADP<\/strong> or similar\n   payroll. A company email address.<\/li>\n<li><strong>Set up your workspace before day one if you are remote.<\/strong> Where you sit, your internet, your\n   background, camera and audio.<\/li>\n<li><strong>A meet-the-team call before your start date.<\/strong> <strong>About 45 minutes.<\/strong> You meet your manager and\n   the people you will sit with. <strong>Most places do this. Some do not.<\/strong><\/li>\n<\/ol>", "quotes": []}, {"id": "4.6", "title": "4.6 Day one and the first week", "html": "<ol>\n<li><strong>Orientation.<\/strong> Company history, policies, HR, benefits enrollment.<\/li>\n<li>\n<p><strong>You get onboarded onto the tech stack the same day.<\/strong> Usually day one of orientation. CRM,\n   dialer, email, calendar, meeting software. <strong>It is a lot at once and nobody retains it all.<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Separated into departments.<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Then into training<\/strong>, which is where the actual job starts.<\/p>\n<\/li>\n<\/ol>\n<p><strong>What normal feels like:<\/strong><\/p>\n<blockquote>\n<p><strong>Lost for the first two weeks. Better by week four.<\/strong><\/p>\n<\/blockquote>\n<p><strong>Somebody who expects to feel competent on day three quits in week two.<\/strong><\/p>", "quotes": ["<blockquote>\n<p><strong>Lost for the first two weeks. Better by week four.<\/strong><\/p>\n<\/blockquote>"]}, {"id": "4.7", "title": "4.7 Questions worth asking before you accept", "html": "<p>Participants leave with these written down.<\/p>\n<ul>\n<li>What does a successful 30, 60 and 90 days look like<\/li>\n<li>When do benefits start<\/li>\n<li>Is any part of my commission paid as a draw, and for how long<\/li>\n<li>\n<p><strong>Is there a retention component, and how is it calculated<\/strong><\/p>\n<\/li>\n<li>\n<p>How are leads or accounts assigned<\/p>\n<\/li>\n<li>Who will I report to, and who is my team lead<\/li>\n<\/ul>", "quotes": []}], "examples": [{"id": "4.5", "title": "4.5 Between signing and day one", "html": "<p><strong>The sequence, as I lived it. Teach it in this order.<\/strong><\/p>\n<ol>\n<li><strong>Equipment ships to your house.<\/strong> MacBook or Lenovo. Sometimes a monitor and headset.<\/li>\n<li><strong>Account setup arrives by email.<\/strong> <strong>Okta<\/strong> or similar single sign-on. <strong>ADP<\/strong> or similar\n   payroll. A company email address.<\/li>\n<li><strong>Set up your workspace before day one if you are remote.<\/strong> Where you sit, your internet, your\n   background, camera and audio.<\/li>\n<li><strong>A meet-the-team call before your start date.<\/strong> <strong>About 45 minutes.<\/strong> You meet your manager and\n   the people you will sit with. <strong>Most places do this. Some do not.<\/strong><\/li>\n<\/ol>", "quotes": []}, {"id": "4.6", "title": "4.6 Day one and the first week", "html": "<ol>\n<li><strong>Orientation.<\/strong> Company history, policies, HR, benefits enrollment.<\/li>\n<li>\n<p><strong>You get onboarded onto the tech stack the same day.<\/strong> Usually day one of orientation. CRM,\n   dialer, email, calendar, meeting software. <strong>It is a lot at once and nobody retains it all.<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Separated into departments.<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Then into training<\/strong>, which is where the actual job starts.<\/p>\n<\/li>\n<\/ol>\n<p><strong>What normal feels like:<\/strong><\/p>\n<blockquote>\n<p><strong>Lost for the first two weeks. Better by week four.<\/strong><\/p>\n<\/blockquote>\n<p><strong>Somebody who expects to feel competent on day three quits in week two.<\/strong><\/p>", "quotes": ["<blockquote>\n<p><strong>Lost for the first two weeks. Better by week four.<\/strong><\/p>\n<\/blockquote>"]}], "quote": "<blockquote>\n<p><strong>Lost for the first two weeks. Better by week four.<\/strong><\/p>\n<\/blockquote>", "activities": "<ol>\n<li><strong>Offer letter teardown.<\/strong> Work through a realistic fictional offer line by line. Mark every term\n   you do not understand, then translate together.<\/li>\n<li><strong>Three-check math.<\/strong> Build base, commission and retention for a good month and a slow month.<\/li>\n<li><strong>Pre-employment readiness checklist.<\/strong> Their own real gaps: documents to gather, references to\n   ask, workspace items to sort out.<\/li>\n<li><strong>First-week question list<\/strong>, in their own words.<\/li>\n<\/ol>", "ai": "<p>Putting unfamiliar offer, benefits and legal language into plain terms. Running the pay math across\nscenarios. <strong>The rule holds: AI explains the language, the participant decides, and anything material\ngets confirmed with the recruiter in writing.<\/strong><\/p>", "pages": ["16C"]}, {"id": 5, "module": 3, "title": "The tools and the day", "time": "2.5 hours", "outcomes": ["Speak the CRM vocabulary you will meet on day one", "Say what a rep actually looks up before making a call", "Build your own daily rhythm and defend it", "Explain what \"goal\" means and how it is measured"], "topics": [{"id": "5.2", "title": "5.2 The lingo, which is what actually transfers", "html": "<p><strong>Most places use Salesforce. The vocabulary is the same across companies even when the buttons\nmove.<\/strong><\/p>\n<ul>\n<li><strong>Closed lost and closed won<\/strong>. the same everywhere<\/li>\n<li>\n<p><strong>Turn the account<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Out of business<\/strong> labeling<\/p>\n<\/li>\n<li>Status labeling generally<\/li>\n<li>\n<p><strong>Lead, contact, account, opportunity, activity, task<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Pipeline<\/strong> and <strong>pipeline stages<\/strong><\/p>\n<\/li>\n<\/ul>", "quotes": []}, {"id": "5.3", "title": "5.3 What Salesforce actually is to a rep", "html": "<p><strong>It is where your pipeline and your call list live.<\/strong> Other software gets mixed in depending on the\ncompany.<\/p>\n<p><strong>When you are prospecting, this is what you look up on an account:<\/strong><\/p>\n<ul>\n<li>\n<p>Is it <strong>in your name or somebody else's name<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Call history.<\/strong> How many attempts have been made.<\/p>\n<\/li>\n<li>\n<p><strong>Who had it before you<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>The notes they left<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Whether there is a gatekeeper<\/strong>, and whether the last rep could get past them<\/p>\n<\/li>\n<li><strong>DNC list.<\/strong> Do not call.<\/li>\n<\/ul>\n<p><strong>And the part that surprises people:<\/strong> a lot of the time you have to <strong>filter out and get rid of a\nbig chunk of your pipeline.<\/strong> It is not all workable.<\/p>", "quotes": []}, {"id": "5.4", "title": "5.4 Pipeline cycles", "html": "<ul>\n<li><strong>You get a new pipeline every two weeks, every month, or every quarter<\/strong> depending on the company<\/li>\n<li>\n<p><strong>You work your pipeline until it is gone<\/strong><\/p>\n<\/li>\n<li>\n<p>There is a <strong>beginning and an end to the sales cycle<\/strong> and they feel different<\/p>\n<\/li>\n<li><strong>End of quarter, everybody is trying to meet goal.<\/strong> There is real energy in the room.<\/li>\n<\/ul>\n<p><strong>Before you close something lost, check your touch point count.<\/strong> (See Session 6. roughly 10.)<\/p>", "quotes": []}, {"id": "5.5", "title": "5.5 Self-prospecting versus working the assigned pipeline", "html": "<blockquote>\n<p><strong>\"Most of the time everybody tells you you can work your own pipeline, you don't need it.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>I was a prospector.<\/strong> I got <strong>60 to 70 percent of everything from outside prospecting on my own.<\/strong>\nThat is what I was known for.<\/p>\n<p><strong>Both are real.<\/strong> Teach both, and be honest that the people who build their own pipeline control\ntheir own paycheck.<\/p>", "quotes": ["<blockquote>\n<p><strong>\"Most of the time everybody tells you you can work your own pipeline, you don't need it.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "5.6", "title": "5.6 The morning routine", "html": "<p><strong>My actual routine, taught as the model.<\/strong><\/p>\n<ol>\n<li>\n<p><strong>Open your pipeline first. Not your email.<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>List views filtered to today's work.<\/strong> Tasks with due dates. You do not start the day deciding\n   what to do. you open the list that already decided.<\/p>\n<\/li>\n<li><strong>Block the day on your calendar.<\/strong> Calendar integrated with the CRM. Color code it if that helps.<\/li>\n<li><strong>Know who you are calling before you dial.<\/strong><\/li>\n<\/ol>\n<p><strong>Time blocks:<\/strong> prospecting, follow-up, meetings, admin. <strong>Protect the prospecting block.<\/strong> It is the\none that always gets eaten.<\/p>", "quotes": []}, {"id": "5.7", "title": "5.7 What \"goal\" means", "html": "<ul>\n<li>\n<p><strong>Usually monthly. Some places biweekly.<\/strong><\/p>\n<\/li>\n<li>\n<p>Goal can be <strong>a number of accounts signed, or a dollar amount.<\/strong><\/p>\n<\/li>\n<\/ul>\n<blockquote>\n<p><strong>At Angi it was $30,000 every two weeks in contracts signed.<\/strong><\/p>\n<\/blockquote>\n<p><strong>Other places measure:<\/strong><\/p>\n<ul>\n<li><strong>How many people you get onboarded<\/strong>, when there is no money up front<\/li>\n<li>\n<p>Some products take <strong>thousands, even $20,000 up front<\/strong><\/p>\n<\/li>\n<li>\n<p>Others take <strong>nothing up front and bill on the back end<\/strong><\/p>\n<\/li>\n<\/ul>\n<p><strong>How the company gets paid determines what you get measured on.<\/strong><\/p>", "quotes": ["<blockquote>\n<p><strong>At Angi it was $30,000 every two weeks in contracts signed.<\/strong><\/p>\n<\/blockquote>"]}, {"id": "5.8", "title": "5.8 Logging the work", "html": "<ul>\n<li>A useful note versus a useless one<\/li>\n<li>\n<p><strong>Always set the next action with a due date before you close the record<\/strong><\/p>\n<\/li>\n<li>\n<p>If it is not in the CRM it did not happen<\/p>\n<\/li>\n<\/ul>", "quotes": []}], "examples": [{"id": "5.5", "title": "5.5 Self-prospecting versus working the assigned pipeline", "html": "<blockquote>\n<p><strong>\"Most of the time everybody tells you you can work your own pipeline, you don't need it.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>I was a prospector.<\/strong> I got <strong>60 to 70 percent of everything from outside prospecting on my own.<\/strong>\nThat is what I was known for.<\/p>\n<p><strong>Both are real.<\/strong> Teach both, and be honest that the people who build their own pipeline control\ntheir own paycheck.<\/p>", "quotes": ["<blockquote>\n<p><strong>\"Most of the time everybody tells you you can work your own pipeline, you don't need it.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "5.6", "title": "5.6 The morning routine", "html": "<p><strong>My actual routine, taught as the model.<\/strong><\/p>\n<ol>\n<li>\n<p><strong>Open your pipeline first. Not your email.<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>List views filtered to today's work.<\/strong> Tasks with due dates. You do not start the day deciding\n   what to do. you open the list that already decided.<\/p>\n<\/li>\n<li><strong>Block the day on your calendar.<\/strong> Calendar integrated with the CRM. Color code it if that helps.<\/li>\n<li><strong>Know who you are calling before you dial.<\/strong><\/li>\n<\/ol>\n<p><strong>Time blocks:<\/strong> prospecting, follow-up, meetings, admin. <strong>Protect the prospecting block.<\/strong> It is the\none that always gets eaten.<\/p>", "quotes": []}], "quote": "<blockquote>\n<p><strong>At Angi it was $30,000 every two weeks in contracts signed.<\/strong><\/p>\n<\/blockquote>", "activities": "<ol>\n<li><strong>Vocabulary walkthrough.<\/strong> The terms are walked through against a real interface or screenshots.<\/li>\n<li><strong>Account read.<\/strong> Given a set of account notes, state what you know before dialing: who, history,\n   gatekeeper, prior attempts, whether it is workable at all.<\/li>\n<li><strong>Build the daily rhythm.<\/strong> Each participant writes their own time-blocked day and defends it.<\/li>\n<li><strong>Note quality drill.<\/strong> Rewrite three bad notes.<\/li>\n<\/ol>", "ai": "<p>Turning raw call notes into a clean entry and a next action. Summarizing an account's history before\na call. <strong>AI drafts the note, the participant confirms it is accurate. A wrong note in a CRM is worse\nthan no note.<\/strong><\/p>", "pages": ["1"]}, {"id": 6, "module": 3, "title": "Prospecting and the opening call", "time": "3 hours", "outcomes": ["Choose accounts instead of dialing a random list", "Work with a gatekeeper instead of against one", "Open a call and read what kind of call it actually is", "Run discovery and let the prospect tell you the answer", "Decide when an account is done, and recognize when you quit too early"], "topics": [{"id": "6.1", "title": "6.1 Ideal customer profile", "html": "<ul>\n<li>Choosing accounts instead of dialing a list<\/li>\n<li><strong>Course default is the new prospect path.<\/strong> Existing customers, win-backs and portal accounts go\n  in the glossary as variations, not drilled. Four paths at once makes people freeze.<\/li>\n<li><strong>Participants pick their own industry.<\/strong> Service businesses or businesses needing exposure. Keep\n  the product simple so the product never becomes the lesson.<\/li>\n<\/ul>", "quotes": []}, {"id": "6.2", "title": "6.2 Researching an account", "html": "<ul>\n<li>What is publicly available and worth two minutes: website, reviews, hours, service area, whether\n  they are hiring, how they present themselves<\/li>\n<li><strong>A specific reason to call.<\/strong> Not \"I saw you're in HVAC.\"<\/li>\n<li><strong>Time zone. Check it before you dial.<\/strong><\/li>\n<\/ul>\n<p><strong>What Pete's vans taught.<\/strong> I never asked Pete his budget. I read spending capacity off what\nwas visible: eight vans, then an acquisition, then eighteen trucks, plus a general manager on salary\nnear $85,000. <strong>Research tells you what somebody can spend before you open your mouth about money.<\/strong><\/p>", "quotes": []}, {"id": "6.3", "title": "6.3 The prospecting sheet", "html": "<p>Company, contact, role, phone, reason to call, last touch, next action. <strong>Clean it.<\/strong> Bad data wastes\nthe block.<\/p>", "quotes": []}, {"id": "6.4", "title": "6.4 Reading account history", "html": "<p>Most accounts have been worked before. Who owns it, who the gatekeeper is, what happened last time.<\/p>\n<blockquote>\n<p><strong>Seasoned reps scan the notes while the phone is ringing.<\/strong><\/p>\n<\/blockquote>", "quotes": ["<blockquote>\n<p><strong>Seasoned reps scan the notes while the phone is ringing.<\/strong><\/p>\n<\/blockquote>"]}, {"id": "6.5", "title": "6.5 The gatekeeper", "html": "<blockquote>\n<p><strong>\"The gatekeeper is one of the most important parts, because that's who you run into the most.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>They determine how much information you get<\/strong> and whether you ever reach the decision maker.<\/p>\n<p><strong>The mistake:<\/strong><\/p>\n<blockquote>\n<p><strong>\"A lot of times people get irritated with the gatekeepers.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>The fix is not a trick. It is the opposite:<\/strong><\/p>\n<blockquote>\n<p><strong>\"Sometimes it's just as simple as starting a conversation with them and not trying to get past\nthem.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>You have to be creative. And you will get hung up on. That happens.<\/strong><\/p>\n<p><strong>My approach, close to my wording:<\/strong><\/p>\n<p><em>Open by respecting their time, not by asking for something:<\/em><\/p>\n<blockquote>\n<p><em>\"Hey, I don't want to interrupt you, I know you got a lot going on today. By the way, how was your\nday?\"<\/em><\/p>\n<\/blockquote>\n<p><em>Establish history, if there is any:<\/em><\/p>\n<blockquote>\n<p><em>\"They've reached out to us, they continue to reach out to us.\"<\/em><\/p>\n<\/blockquote>\n<p><em>Act like you know who the decision maker is.<\/em> You may already have the name in your CRM notes.<\/p>\n<p><em>Then ask for the path, not the person:<\/em><\/p>\n<blockquote>\n<p><em>\"I don't want to clog up your day. What's a good time to reach them? Do they have a direct email?\nWhat's a better email? What about a cell phone? Is there any way you can message them now, reach\nout, or pass along a message?\"<\/em><\/p>\n<\/blockquote>\n<p><strong>You are not trying to beat her. You are asking her to route you.<\/strong><\/p>\n<blockquote>\n<p><strong>\"Gatekeepers are part of the game.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Timing is a real lever.<\/strong> Call back at a different time and they are often more polite. sometimes\nthey will even apologize for the earlier call.<\/p>\n<p><strong>The warning:<\/strong><\/p>\n<blockquote>\n<p><strong>\"It's a fine line between being persistent and kind of burning the call.\"<\/strong><\/p>\n<\/blockquote>\n<ol>\n<li><strong>She is a source, not an obstacle.<\/strong> She knows the owner's schedule, his mood, and whether three\n   competitors already called this week.<\/li>\n<li><strong>Never fake it.<\/strong> Do not imply you have an appointment or that you already spoke to the owner. It\n   works once and burns the account permanently, because she tells him.<\/li>\n<li><strong>Get her name and log it in the CRM.<\/strong> Next call you open with her name and you are not a\n   stranger.<\/li>\n<\/ol>", "quotes": ["<blockquote>\n<p><strong>\"The gatekeeper is one of the most important parts, because that's who you run into the most.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"A lot of times people get irritated with the gatekeepers.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Sometimes it's just as simple as starting a conversation with them and not trying to get past\nthem.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><em>\"Hey, I don't want to interrupt you, I know you got a lot going on today. By the way, how was your\nday?\"<\/em><\/p>\n<\/blockquote>", "<blockquote>\n<p><em>\"They've reached out to us, they continue to reach out to us.\"<\/em><\/p>\n<\/blockquote>", "<blockquote>\n<p><em>\"I don't want to clog up your day. What's a good time to reach them? Do they have a direct email?\nWhat's a better email? What about a cell phone? Is there any way you can message them now, reach\nout, or pass along a message?\"<\/em><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Gatekeepers are part of the game.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"It's a fine line between being persistent and kind of burning the call.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "6.6", "title": "6.6 The opener", "html": "<ul>\n<li><strong>At a small business, assume you have the decision maker.<\/strong> Usually you do.<\/li>\n<li>\n<p>Name, then a permission ask. My version: <strong>\"You got ten seconds?\"<\/strong><\/p>\n<\/li>\n<li>\n<p>Say why you are calling.<\/p>\n<\/li>\n<li><strong>Keep it short.<\/strong> The opener buys the right to ask a question.<\/li>\n<li><strong>Participants write their own.<\/strong> A borrowed opener sounds borrowed.<\/li>\n<\/ul>\n<p><em>This section is my own approach, from my own calls. It is experience, not published data.<\/em><\/p>", "quotes": []}, {"id": "6.7", "title": "6.7 Read the reaction before anything else", "html": "<table>\n<thead>\n<tr>\n<th>What you hear<\/th>\n<th>What it is<\/th>\n<th>Your next sentence<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>They do not know you<\/td>\n<td>Cold. Normal.<\/td>\n<td>Proceed.<\/td>\n<\/tr>\n<tr>\n<td>\"Not you again\"<\/td>\n<td>Somebody burned this account<\/td>\n<td>Acknowledge it fast. Do not pretend.<\/td>\n<\/tr>\n<tr>\n<td>They showed interest before and got dropped<\/td>\n<td><strong>An opening, not a problem<\/strong><\/td>\n<td><em>\"Give me a minute to tell you where we dropped the ball.\"<\/em><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Cold, warm and burned are three different calls.<\/strong><\/p>", "quotes": []}, {"id": "6.8", "title": "6.8 Discovery", "html": "<ul>\n<li><strong>Open ended only.<\/strong> What, how, tell me about.<\/li>\n<li>\n<p><strong>Talk ratio: you 40, them 60.<\/strong><\/p>\n<\/li>\n<li>\n<p>Current state to desired state. Business impact.<\/p>\n<\/li>\n<li><strong>Second-level questions.<\/strong> The first answer is the public version.<\/li>\n<\/ul>", "quotes": []}, {"id": "6.9", "title": "6.9 The story opener", "html": "<blockquote>\n<p><strong>Before you get into the business, ask them to tell you the story of it.<\/strong><\/p>\n<\/blockquote>\n<p>They ramble, and in the rambling you get the emotional connection to the thing they built.<\/p>\n<blockquote>\n<p><strong>It is a logical sale and an emotional sale.<\/strong><\/p>\n<\/blockquote>\n<p><strong>Questions I use to go deeper:<\/strong> have you invested in the business, have you tried advertising, have you\ntried marketing.<\/p>\n<blockquote>\n<p><strong>\"Most of the time they'll tell you their own solution in discovery, if you let them talk.\"<\/strong><\/p>\n<\/blockquote>", "quotes": ["<blockquote>\n<p><strong>Before you get into the business, ask them to tell you the story of it.<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>It is a logical sale and an emotional sale.<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Most of the time they'll tell you their own solution in discovery, if you let them talk.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "6.10", "title": "6.10 Reflect back", "html": "<blockquote>\n<p><strong>\"From what I'm hearing, you need this, this and that.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Do not assume the problem. Confirm it.<\/strong> If you cannot say their problem back in one sentence, you\ndid not do discovery.<\/p>", "quotes": ["<blockquote>\n<p><strong>\"From what I'm hearing, you need this, this and that.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "6.11", "title": "6.11 Qualifying. MEDDIC as a checklist", "html": "<ul>\n<li><strong>M<\/strong> Metrics. <strong>E<\/strong> Economic buyer. <strong>D<\/strong> Decision criteria. <strong>D<\/strong> Decision process ·\n  <strong>I<\/strong> Identify pain. <strong>C<\/strong> Champion<\/li>\n<\/ul>\n<p><strong>The second D saves you.<\/strong> Ask who else is involved NOW and \"let me talk to my wife\" never surprises\nyou at the close.<\/p>\n<p><strong>The up-front contract:<\/strong> agree at the top what happens at the end.<\/p>", "quotes": []}, {"id": "6.12", "title": "6.12 How many times before you let it go", "html": "<p><strong>New 2026-09-11.<\/strong><\/p>\n<blockquote>\n<p><strong>Roughly 10 touch points<\/strong>, with no clear communication, before you move on.<\/p>\n<\/blockquote>\n<p><strong>The failure mode is the real lesson. people quit far too early:<\/strong><\/p>\n<blockquote>\n<p><strong>\"You don't want to have two touch points and you've never talked to anybody. You've never been\ntold no. You've never been told do not call.\"<\/strong><\/p>\n<p><strong>\"At two or three touch points you're not going to get any sales. You're not going to meet goal.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Especially in an SDR or BDR role<\/strong>, where volume is the job.<\/p>\n<p><strong>Different for high ticket:<\/strong> more relationship building, and you may work the same account a long\ntime.<\/p>\n<blockquote>\n<p><strong>\"Sometimes you do have to just move on. It is what it is.\"<\/strong><\/p>\n<\/blockquote>", "quotes": ["<blockquote>\n<p><strong>Roughly 10 touch points<\/strong>, with no clear communication, before you move on.<\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"You don't want to have two touch points and you've never talked to anybody. You've never been\ntold no. You've never been told do not call.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"At two or three touch points you're not going to get any sales. You're not going to meet goal.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Sometimes you do have to just move on. It is what it is.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "6.13", "title": "6.13 Securing the next step", "html": "<p><strong>A booked meeting with a date and a time is not automatically a next step. Here is the difference.<\/strong><\/p>\n<p><strong>A next step is a read on urgency, not a calendar slot.<\/strong><\/p>\n<blockquote>\n<p><strong>\"Typically you want to see what the urgency looks like.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>In an SDR or BDR role you are not in a long sales cycle.<\/strong> <em>\"You're in a very short window sales\ncycle, where you prospect and get somebody onboard for someone else.\"<\/em><\/p>\n<p><strong>A good discovery already told you five things:<\/strong><\/p>\n<ul>\n<li>What type of <strong>urgency<\/strong> they have<\/li>\n<li>\n<p>Their <strong>timeline<\/strong><\/p>\n<\/li>\n<li>\n<p>Whether they are <strong>ready to invest<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>How curious<\/strong> they are<\/p>\n<\/li>\n<li>Whether they are <strong>just curious, or actively trying to find a solution<\/strong><\/li>\n<\/ul>\n<blockquote>\n<p><strong>\"Discovery is the most important part of the call.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>If you cannot answer those five, you are not ready to ask for a next step.<\/strong><\/p>\n<p><strong>The \"next week\" trap:<\/strong><\/p>\n<blockquote>\n<p><strong>\"If somebody is interested, their interest will waver by the time next week comes. You'll be\ngetting put off.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Book it as close in as the urgency justifies. Not automatically next week.<\/strong><\/p>\n<p><strong>The hard line about the job:<\/strong><\/p>\n<blockquote>\n<p><strong>\"If you just keep scheduling appointments, you're just an appointment setter.\"<\/strong><\/p>\n<\/blockquote>\n<p>And I do not say it as an insult: <em>\"That's OK. Some people are. Most of the time the SDR is an\nappointment setter.\"<\/em> <strong>But:<\/strong> <em>\"you do want to set solid appointments as well, and you figure that\nout in discovery.\"<\/em><\/p>\n<p><strong>THE TACTIC. lock it in before you hang up:<\/strong><\/p>\n<blockquote>\n<p><strong>Most of the time I send the calendar invite while I'm still on the phone.<\/strong><\/p>\n<p><em>\"Hey man, I'm a busy guy, I like to stay on top of things. You got that calendar invite? Could you\nhit accept on your end? That'd be awesome.\"<\/em><\/p>\n<\/blockquote>\n<p><strong>Why it works:<\/strong> their interest is at its peak right now, you get a confirmed accept instead of a\nverbal maybe, and the framing makes it about your professionalism rather than chasing them.<\/p>", "quotes": ["<blockquote>\n<p><strong>\"Typically you want to see what the urgency looks like.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Discovery is the most important part of the call.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"If somebody is interested, their interest will waver by the time next week comes. You'll be\ngetting put off.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"If you just keep scheduling appointments, you're just an appointment setter.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>Most of the time I send the calendar invite while I'm still on the phone.<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><em>\"Hey man, I'm a busy guy, I like to stay on top of things. You got that calendar invite? Could you\nhit accept on your end? That'd be awesome.\"<\/em><\/p>\n<\/blockquote>"]}], "examples": [{"id": "6.2", "title": "6.2 Researching an account", "html": "<ul>\n<li>What is publicly available and worth two minutes: website, reviews, hours, service area, whether\n  they are hiring, how they present themselves<\/li>\n<li><strong>A specific reason to call.<\/strong> Not \"I saw you're in HVAC.\"<\/li>\n<li><strong>Time zone. Check it before you dial.<\/strong><\/li>\n<\/ul>\n<p><strong>What Pete's vans taught.<\/strong> I never asked Pete his budget. I read spending capacity off what\nwas visible: eight vans, then an acquisition, then eighteen trucks, plus a general manager on salary\nnear $85,000. <strong>Research tells you what somebody can spend before you open your mouth about money.<\/strong><\/p>", "quotes": []}, {"id": "6.5", "title": "6.5 The gatekeeper", "html": "<blockquote>\n<p><strong>\"The gatekeeper is one of the most important parts, because that's who you run into the most.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>They determine how much information you get<\/strong> and whether you ever reach the decision maker.<\/p>\n<p><strong>The mistake:<\/strong><\/p>\n<blockquote>\n<p><strong>\"A lot of times people get irritated with the gatekeepers.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>The fix is not a trick. It is the opposite:<\/strong><\/p>\n<blockquote>\n<p><strong>\"Sometimes it's just as simple as starting a conversation with them and not trying to get past\nthem.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>You have to be creative. And you will get hung up on. That happens.<\/strong><\/p>\n<p><strong>My approach, close to my wording:<\/strong><\/p>\n<p><em>Open by respecting their time, not by asking for something:<\/em><\/p>\n<blockquote>\n<p><em>\"Hey, I don't want to interrupt you, I know you got a lot going on today. By the way, how was your\nday?\"<\/em><\/p>\n<\/blockquote>\n<p><em>Establish history, if there is any:<\/em><\/p>\n<blockquote>\n<p><em>\"They've reached out to us, they continue to reach out to us.\"<\/em><\/p>\n<\/blockquote>\n<p><em>Act like you know who the decision maker is.<\/em> You may already have the name in your CRM notes.<\/p>\n<p><em>Then ask for the path, not the person:<\/em><\/p>\n<blockquote>\n<p><em>\"I don't want to clog up your day. What's a good time to reach them? Do they have a direct email?\nWhat's a better email? What about a cell phone? Is there any way you can message them now, reach\nout, or pass along a message?\"<\/em><\/p>\n<\/blockquote>\n<p><strong>You are not trying to beat her. You are asking her to route you.<\/strong><\/p>\n<blockquote>\n<p><strong>\"Gatekeepers are part of the game.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Timing is a real lever.<\/strong> Call back at a different time and they are often more polite. sometimes\nthey will even apologize for the earlier call.<\/p>\n<p><strong>The warning:<\/strong><\/p>\n<blockquote>\n<p><strong>\"It's a fine line between being persistent and kind of burning the call.\"<\/strong><\/p>\n<\/blockquote>\n<ol>\n<li><strong>She is a source, not an obstacle.<\/strong> She knows the owner's schedule, his mood, and whether three\n   competitors already called this week.<\/li>\n<li><strong>Never fake it.<\/strong> Do not imply you have an appointment or that you already spoke to the owner. It\n   works once and burns the account permanently, because she tells him.<\/li>\n<li><strong>Get her name and log it in the CRM.<\/strong> Next call you open with her name and you are not a\n   stranger.<\/li>\n<\/ol>", "quotes": ["<blockquote>\n<p><strong>\"The gatekeeper is one of the most important parts, because that's who you run into the most.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"A lot of times people get irritated with the gatekeepers.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Sometimes it's just as simple as starting a conversation with them and not trying to get past\nthem.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><em>\"Hey, I don't want to interrupt you, I know you got a lot going on today. By the way, how was your\nday?\"<\/em><\/p>\n<\/blockquote>", "<blockquote>\n<p><em>\"They've reached out to us, they continue to reach out to us.\"<\/em><\/p>\n<\/blockquote>", "<blockquote>\n<p><em>\"I don't want to clog up your day. What's a good time to reach them? Do they have a direct email?\nWhat's a better email? What about a cell phone? Is there any way you can message them now, reach\nout, or pass along a message?\"<\/em><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Gatekeepers are part of the game.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"It's a fine line between being persistent and kind of burning the call.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "6.9", "title": "6.9 The story opener", "html": "<blockquote>\n<p><strong>Before you get into the business, ask them to tell you the story of it.<\/strong><\/p>\n<\/blockquote>\n<p>They ramble, and in the rambling you get the emotional connection to the thing they built.<\/p>\n<blockquote>\n<p><strong>It is a logical sale and an emotional sale.<\/strong><\/p>\n<\/blockquote>\n<p><strong>Questions I use to go deeper:<\/strong> have you invested in the business, have you tried advertising, have you\ntried marketing.<\/p>\n<blockquote>\n<p><strong>\"Most of the time they'll tell you their own solution in discovery, if you let them talk.\"<\/strong><\/p>\n<\/blockquote>", "quotes": ["<blockquote>\n<p><strong>Before you get into the business, ask them to tell you the story of it.<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>It is a logical sale and an emotional sale.<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Most of the time they'll tell you their own solution in discovery, if you let them talk.\"<\/strong><\/p>\n<\/blockquote>"]}], "quote": "<blockquote>\n<p><strong>\"Typically you want to see what the urgency looks like.\"<\/strong><\/p>\n<\/blockquote>", "activities": "<ol>\n<li><strong>Build a prospecting sheet.<\/strong> Twenty researched accounts in an industry they
