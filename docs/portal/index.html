 chose.<\/li>\n<li><strong>Account brief.<\/strong> One page on one of them.<\/li>\n<li><strong>Gatekeeper role-play.<\/strong> Partner plays the office manager. Practice routing, not beating.<\/li>\n<li><strong>Cold call role-plays, rotating.<\/strong> Everybody calls, everybody gets called.<\/li>\n<li><strong>Story opener drill.<\/strong> One plays a business owner, the other may only ask for the story, then\n   shuts up. Debrief on what came out that a question list would have missed.<\/li>\n<li><strong>Next-step drill.<\/strong> Before asking for the meeting, say the five urgency answers out loud. Then\n   book and confirm inside the role-play, before hanging up.<\/li>\n<\/ol>", "ai": "<p><strong>The heaviest AI use in the course.<\/strong> Account research, list building and cleaning, the account brief\nbefore the dial, discovery questions written for that specific business, and role-playing the call\nbefore it costs a real one. <strong>The participant verifies every source and makes every decision.<\/strong><\/p>", "pages": ["1", "1B", "2", "3", "4", "5", "6", "7", "7B", "16B"]}, {"id": 7, "module": 3, "title": "Presenting, objections, price and closing", "time": "3 hours", "outcomes": ["Present back what you heard instead of giving a product tour", "Recognize the four objections that actually come up and answer them in your own words", "Deliver a price and stay quiet", "Diagnose which step you skipped when somebody balks", "Protect a sale through onboarding"], "topics": [{"id": "7.1", "title": "7.1 Presenting back what you heard", "html": "<ul>\n<li><strong>Not a product tour.<\/strong> Their own words handed back with a solution attached.<\/li>\n<li>Outcomes, not features. Proof kept short. Check understanding as you go.<\/li>\n<li><strong>DO NOT STAT DUMP.<\/strong> Reps get lost in their own numbers and lose the room.<\/li>\n<li><strong>Know your product's real proof metrics.<\/strong> Four or five, not twenty. <strong>At Angi:<\/strong> impressions,\n  profile interactions, taps to reveal the phone number, map searches.<\/li>\n<\/ul>", "quotes": []}, {"id": "7.2", "title": "7.2 The yes ladder", "html": "<p><strong>Micro-commitments<\/strong> stacked so the final ask is not the first yes.<\/p>\n<p><strong>Trial close:<\/strong> <em>\"Once we get this settled, are you ready to move forward today?\"<\/em><\/p>\n<p><strong>Every small yes is ammunition at the close.<\/strong><\/p>", "quotes": []}, {"id": "7.3", "title": "7.3 The four objections", "html": "<p><strong>My list, in customers' real words.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Bucket<\/th>\n<th>What they actually say<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>No need and status quo<\/strong><\/td>\n<td>\"We get a lot of word of mouth.\" \"We're all organic.\" \"I let my work speak for itself.\"<\/td>\n<\/tr>\n<tr>\n<td><strong>Been burned before<\/strong><\/td>\n<td>\"I've tried other companies.\" \"I already paid someone for SEO and it didn't work.\"<\/td>\n<\/tr>\n<tr>\n<td><strong>Somebody else said you're no good<\/strong><\/td>\n<td>\"A friend of mine told me it didn't work for them.\"<\/td>\n<\/tr>\n<tr>\n<td><strong>Not my decision<\/strong><\/td>\n<td>\"Let me talk to my wife.\" \"Let me talk to my business partner.\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>The third is harder than price<\/strong>. you are fighting a trusted source, not a number.<\/p>\n<p><strong>What ties Sessions 6 and 7 together:<\/strong>\n<strong>The fourth bucket is not an objection. It is a discovery failure showing up late.<\/strong> If \"let me talk\nto my wife\" surprises you at the close, you did not ask who else was involved back in Session 6.<\/p>\n<p><em>These four are the ones I heard most on my own calls. Your market may add others.<\/em><\/p>", "quotes": []}, {"id": "7.4", "title": "7.4 Handling and looping", "html": "<p><strong>Question, concern and objection are three different things. Clarify before responding.<\/strong><\/p>\n<p><strong>Looping:<\/strong> handle it, rebuild certainty, close again, repeat.<\/p>\n<p><strong>AN OBJECTION IS NOT A NUMBER.<\/strong> Do not drop price on resistance. Find the disconnect.<\/p>", "quotes": []}, {"id": "7.5", "title": "7.5 Price", "html": "<h3>The three lines<\/h3>\n<blockquote>\n<p><strong>1. If they don't see value, five dollars is too much.<\/strong>\n<strong>2. Don't spend other people's money with your pockets.<\/strong>\n<strong>3. Once you let price go, you can't take it back.<\/strong><\/p>\n<\/blockquote>\n<h3>Delivering it<\/h3>\n<ul>\n<li>\n<p><strong>Even when they ask directly, do not blurt it.<\/strong><\/p>\n<\/li>\n<li>\n<p>You already know from discovery what they spend elsewhere.<\/p>\n<\/li>\n<li>\n<p><strong>Attach the number to the specific problems they described.<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Do not bundle extras up front.<\/strong> Free things before agreement buy nothing. Extras come after.<\/p>\n<\/li>\n<li>Tiered, with a clear next step at each tier.<\/li>\n<\/ul>\n<h3>The two stories<\/h3>\n<p><strong>Thumbtack.<\/strong> I quoted $2,500 a month. At the end of the call the customer volunteered he was\nalready paying Thumbtack about $6,000. <strong>I priced from my own wallet, not the customer's.<\/strong><\/p>\n<p><strong>Pete, Greensboro.<\/strong> Electrical and HVAC. Eight vans, bought a Charlotte company with ten Sprinter\nvans, ended up around eighteen trucks, GM on salary near $85,000. Pete said it was the best sales\ncall he had ever been on, then gave me this:<\/p>\n<blockquote>\n<p><em>\"For somebody like me who's obviously spending money, and the questions you asked already verified\nI spend money, don't ever bring up money before we get to the spending part.\"<\/em><\/p>\n<\/blockquote>\n<p><strong>The skill inside it: qualify spending capacity through discovery instead of asking a budget\nquestion.<\/strong> New reps ask \"what's your budget,\" get a lowball number, then negotiate against it all\ncall.<\/p>\n<h3>Price resistance is diagnostic<\/h3>\n<p><strong>If they get wary at the number, that is information about what you skipped.<\/strong> You do not argue\nprice. You go back and find the hole. <strong>That is what the handbook is for.<\/strong><\/p>", "quotes": ["<blockquote>\n<p><strong>1. If they don't see value, five dollars is too much.<\/strong>\n<strong>2. Don't spend other people's money with your pockets.<\/strong>\n<strong>3. Once you let price go, you can't take it back.<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><em>\"For somebody like me who's obviously spending money, and the questions you asked already verified\nI spend money, don't ever bring up money before we get to the spending part.\"<\/em><\/p>\n<\/blockquote>"]}, {"id": "7.6", "title": "7.6 The close", "html": "<blockquote>\n<h1>SILENCE IS CONFIDENCE.<\/h1>\n<h2>Say the number and stop talking.<\/h2>\n<\/blockquote>\n<p><strong>There will be a weird pause. It feels worse to you than it does to them.<\/strong> Filling it is how reps\ntalk themselves into a discount nobody asked for.<\/p>\n<p><strong>\"Let me think about it, call me tomorrow.\"<\/strong> Keep it light. Match the tone. Do not offend. Then hand\nthem back their own words: <em>you reached out to us first, you told me your friends are using it and\nit's working.<\/em><\/p>\n<p><strong>Only works if you collected the yeses.<\/strong> Without them you are arguing. With them you are reminding.<\/p>", "quotes": ["<blockquote>\n<h1>SILENCE IS CONFIDENCE.<\/h1>\n<h2>Say the number and stop talking.<\/h2>\n<\/blockquote>"]}, {"id": "7.7", "title": "7.7 Humor and personality", "html": "<p>I defuse hard moments with light humor. Do not borrow my lines, because they work in my mouth and\nnot yours. <strong>What transfers is reading the tone in the room and matching it.<\/strong> Finding your own\nversion of that is part of becoming good at this.<\/p>", "quotes": []}, {"id": "7.8", "title": "7.8 The no", "html": "<ul>\n<li>\n<p>Not everyone buys. <strong>A flat no means stop pushing.<\/strong><\/p>\n<\/li>\n<li>\n<p>Turn-it-or-burn-it shops versus relationship selling. Both exist. Know which you are in.<\/p>\n<\/li>\n<li>Walking away well leaves the door open.<\/li>\n<\/ul>", "quotes": []}, {"id": "7.9", "title": "7.9 Cold feet and the handoff", "html": "<p><strong>This is worth rehearsing.<\/strong><\/p>\n<p><strong>People back out mid-onboarding, after signing and before the sale finalizes.<\/strong><\/p>\n<p>Coaching them through the wobble:<\/p>\n<blockquote>\n<p><em>\"I get it. I got you. Let's finish this last part so we can get you going.\"<\/em><\/p>\n<\/blockquote>\n<p><strong>Document exactly what you promised<\/strong>, word for word, so onboarding does not contradict you.<\/p>\n<p><strong>My position, and it is a difference worth naming:<\/strong><\/p>\n<blockquote>\n<p><strong>I onboard the customer myself. Every place I have worked, regardless of who is behind me.<\/strong><\/p>\n<\/blockquote>\n<p>Customer success gets busy and carries their own workload. <strong>It is your retention, your account, your\nmoney.<\/strong> And retention is a real check. see Module 2.<\/p>\n<p><strong>The position taught here is to protect it.<\/strong><\/p>", "quotes": ["<blockquote>\n<p><em>\"I get it. I got you. Let's finish this last part so we can get you going.\"<\/em><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>I onboard the customer myself. Every place I have worked, regardless of who is behind me.<\/strong><\/p>\n<\/blockquote>"]}], "examples": [{"id": "7.5", "title": "7.5 Price", "html": "<h3>The three lines<\/h3>\n<blockquote>\n<p><strong>1. If they don't see value, five dollars is too much.<\/strong>\n<strong>2. Don't spend other people's money with your pockets.<\/strong>\n<strong>3. Once you let price go, you can't take it back.<\/strong><\/p>\n<\/blockquote>\n<h3>Delivering it<\/h3>\n<ul>\n<li>\n<p><strong>Even when they ask directly, do not blurt it.<\/strong><\/p>\n<\/li>\n<li>\n<p>You already know from discovery what they spend elsewhere.<\/p>\n<\/li>\n<li>\n<p><strong>Attach the number to the specific problems they described.<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Do not bundle extras up front.<\/strong> Free things before agreement buy nothing. Extras come after.<\/p>\n<\/li>\n<li>Tiered, with a clear next step at each tier.<\/li>\n<\/ul>\n<h3>The two stories<\/h3>\n<p><strong>Thumbtack.<\/strong> I quoted $2,500 a month. At the end of the call the customer volunteered he was\nalready paying Thumbtack about $6,000. <strong>I priced from my own wallet, not the customer's.<\/strong><\/p>\n<p><strong>Pete, Greensboro.<\/strong> Electrical and HVAC. Eight vans, bought a Charlotte company with ten Sprinter\nvans, ended up around eighteen trucks, GM on salary near $85,000. Pete said it was the best sales\ncall he had ever been on, then gave me this:<\/p>\n<blockquote>\n<p><em>\"For somebody like me who's obviously spending money, and the questions you asked already verified\nI spend money, don't ever bring up money before we get to the spending part.\"<\/em><\/p>\n<\/blockquote>\n<p><strong>The skill inside it: qualify spending capacity through discovery instead of asking a budget\nquestion.<\/strong> New reps ask \"what's your budget,\" get a lowball number, then negotiate against it all\ncall.<\/p>\n<h3>Price resistance is diagnostic<\/h3>\n<p><strong>If they get wary at the number, that is information about what you skipped.<\/strong> You do not argue\nprice. You go back and find the hole. <strong>That is what the handbook is for.<\/strong><\/p>", "quotes": ["<blockquote>\n<p><strong>1. If they don't see value, five dollars is too much.<\/strong>\n<strong>2. Don't spend other people's money with your pockets.<\/strong>\n<strong>3. Once you let price go, you can't take it back.<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><em>\"For somebody like me who's obviously spending money, and the questions you asked already verified\nI spend money, don't ever bring up money before we get to the spending part.\"<\/em><\/p>\n<\/blockquote>"]}], "quote": "<blockquote>\n<p><em>\"I get it. I got you. Let's finish this last part so we can get you going.\"<\/em><\/p>\n<\/blockquote>", "activities": "<ol>\n<li><strong>Build a short presentation<\/strong> from Session 6 discovery notes. Deliver in five minutes.<\/li>\n<li><strong>Objection gauntlet.<\/strong> All four buckets in their real wording. Rotate until responses stop\n   sounding rehearsed.<\/li>\n<li><strong>Price delivery drill.<\/strong> Say the number, stay silent. Time how long you can hold the silence.<\/li>\n<li><strong>Diagnostic drill.<\/strong> Given a call where the prospect balked, work backward and find the skipped\n   step.<\/li>\n<li><strong>Handoff document<\/strong> for their own worked opportunity.<\/li>\n<\/ol>", "ai": "<p>Building the presentation from discovery notes. <strong>Role-playing objections until responses are\nnatural<\/strong>, including the \"a friend said it didn't work\" one that is hardest to practice against\nsomebody you know. Rehearsing price delivery. Drafting the handoff document.<\/p>", "pages": ["8", "9", "10", "11", "12", "13", "14", "15", "16"]}, {"id": 8, "module": 4, "title": "Surviving and advancing", "time": "2.5 hours", "outcomes": ["Say what is expected of you at 30, 60 and 90 days", "Name the specific behaviors that get new reps cut", "Explain what QA is and why everyone fails one", "Walk into a one-on-one prepared instead of defensive"], "topics": [{"id": "8.1", "title": "8.1 What the first 90 days actually is", "html": "<ul>\n<li><strong>You are usually on a draw.<\/strong> Estimated commission paid up front. (Module 2.)<\/li>\n<li><strong>The first couple weeks are typically training.<\/strong> Sales training is part of it.<\/li>\n<li><strong>Do not stress too much<\/strong>, depending on where you are.<\/li>\n<\/ul>", "quotes": []}, {"id": "8.2", "title": "8.2 What actually washes people out", "html": "<p><strong>Not the official reason. What I watched happen.<\/strong><\/p>\n<h3>It gets monotonous<\/h3>\n<p>The job is repetitive and most people are not braced for it.<\/p>\n<h3>Assuming the person does not want to hear from you<\/h3>\n<blockquote>\n<p><strong>\"Not assuming that this person doesn't want to hear from you like the last person.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>This is a mindset failure and it kills calls.<\/strong> You carry the last rejection into the next dial and\nthe prospect hears it in your voice.<\/p>\n<h3>Overly complaining<\/h3>\n<h3>Not taking coaching<\/h3>\n<h3>Not meeting your KPIs<\/h3>", "quotes": ["<blockquote>\n<p><strong>\"Not assuming that this person doesn't want to hear from you like the last person.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "8.3", "title": "8.3 The real reason", "html": "<blockquote>\n<p><strong>\"A lot of people get washed out just off of effort.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>My example:<\/strong><\/p>\n<blockquote>\n<p>If your talk time is under two hours, they will tell you that you need <strong>at least 100 touch points\na day.<\/strong> Make sure you get that.<\/p>\n<\/blockquote>\n<p><strong>The fix is mapping your day:<\/strong><\/p>\n<blockquote>\n<p><strong>\"There is a time for research and there's a time to just pick up the phone and dial.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Smiling and dialing.<\/strong> Especially in an SDR role.<\/p>\n<blockquote>\n<p><strong>\"That's the only way you get better.\"<\/strong><\/p>\n<\/blockquote>\n<h3>And the other quiet killer. quitting on accounts too early<\/h3>\n<p>From Module 3: <strong>roughly 10 touch points<\/strong> before you move on.<\/p>\n<blockquote>\n<p><strong>\"You don't want to have two touch points and you've never talked to anybody. You've never been\ntold no. You've never been told do not call.\"<\/strong><\/p>\n<p><strong>\"At two or three touch points you're not going to get any sales. You're not going to meet goal.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Most new reps never learn this is why they missed goal.<\/strong><\/p>", "quotes": ["<blockquote>\n<p><strong>\"A lot of people get washed out just off of effort.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p>If your talk time is under two hours, they will tell you that you need <strong>at least 100 touch points\na day.<\/strong> Make sure you get that.<\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"There is a time for research and there's a time to just pick up the phone and dial.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"That's the only way you get better.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"You don't want to have two touch points and you've never talked to anybody. You've never been\ntold no. You've never been told do not call.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"At two or three touch points you're not going to get any sales. You're not going to meet goal.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "8.4", "title": "8.4 What actually keeps you employed", "html": "<p><strong>Most people do not come out of the box killing it. That is normal.<\/strong><\/p>\n<ul>\n<li><strong>They want to see effort.<\/strong> First thing.<\/li>\n<li><strong>Cultural fit.<\/strong> Can you work as a team.<\/li>\n<li>\n<p><strong>Taking constructive criticism, not just the compliments.<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Being a team player.<\/strong><\/p>\n<\/li>\n<\/ul>\n<blockquote>\n<p><strong>\"People want you on a team. You're going to be there. You're going to succeed.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Effort and coachability keep you employed long enough to get good. Talent does not.<\/strong><\/p>", "quotes": ["<blockquote>\n<p><strong>\"People want you on a team. You're going to be there. You're going to succeed.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "8.5", "title": "8.5 One-on-ones and call reviews", "html": "<p><strong>These do not stop when you get tenured.<\/strong><\/p>\n<p><strong>With your manager you go over your phone calls together and break them down.<\/strong><\/p>\n<p><strong>And the thing that makes it work:<\/strong><\/p>\n<blockquote>\n<p><strong>\"Most of the time when you listen back, you immediately know what you could have said different,\nor what you said too early, if you got impatient. You can just kind of tell.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>You do not need somebody to tell you what went wrong. Hearing it is the lesson.<\/strong><\/p>", "quotes": ["<blockquote>\n<p><strong>\"Most of the time when you listen back, you immediately know what you could have said different,\nor what you said too early, if you got impatient. You can just kind of tell.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "8.6", "title": "8.6 Getting used to your own voice", "html": "<p><strong>Name this in Session 3 too, at the first recorded role-play.<\/strong><\/p>\n<blockquote>\n<p><strong>\"You're still gonna have to get used to hearing your voice, hearing yourself make mistakes, to\nget better.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>This is why participants resist recorded practice. Say it before it happens, not after.<\/strong><\/p>", "quotes": ["<blockquote>\n<p><strong>\"You're still gonna have to get used to hearing your voice, hearing yourself make mistakes, to\nget better.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "8.7", "title": "8.7 QA. two different things, and people confuse them", "html": "<p><strong>1. Your manager reviewing calls with you.<\/strong> Coaching. Breaking down what happened.<\/p>\n<p><strong>2. Company QA.<\/strong> Compliance.\n- Making sure you are <strong>not saying something you are not supposed to say<\/strong><\/p>\n<ul>\n<li>\n<p><strong>So the company does not get sued<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Sometimes the rules change and you will be notified<\/strong><\/p>\n<\/li>\n<\/ul>\n<p><strong>The line that belongs in the handbook:<\/strong><\/p>\n<blockquote>\n<p><strong>\"Everybody gets QA. Everybody gets QA fails. It's kind of a part of it at the end of the day.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Why it matters:<\/strong> a new rep who fails a QA thinks they are about to be fired. They are not.\nNormalize it before it happens.<\/p>", "quotes": ["<blockquote>\n<p><strong>\"Everybody gets QA. Everybody gets QA fails. It's kind of a part of it at the end of the day.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "8.8", "title": "8.8 Moving up", "html": "<p><strong>Keep this short. Do not build a section around it.<\/strong><\/p>\n<p>My actual position: it is not that everybody who shares gets promoted. But <strong>when you find something\nthat works, you make your manager look better and your team better.<\/strong> Somebody else may get the extra\nsale. That is the trade.<\/p>\n<p><strong>And what actually happens when you are doing well:<\/strong><\/p>\n<blockquote>\n<p><strong>A lot of times they will ask you to volunteer to share it with the organization during the big\nhuddle.<\/strong><\/p>\n<p><strong>\"Be a team player. It sounds corny, sounds redundant, but yeah.\"<\/strong><\/p>\n<\/blockquote>", "quotes": ["<blockquote>\n<p><strong>A lot of times they will ask you to volunteer to share it with the organization during the big\nhuddle.<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"Be a team player. It sounds corny, sounds redundant, but yeah.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "8.9", "title": "8.9 Where the career goes", "html": "<ul>\n<li><strong>Senior AE and Strategic AE<\/strong>. bigger accounts, base climbs to $75,000+ before commission<\/li>\n<li>\n<p><strong>Account Management and Partner Management<\/strong>. assigned a book of business, keep the customer first\n  and happy. <em>\"You're hired to be a go-between.\"<\/em><\/p>\n<\/li>\n<li>\n<p><strong>Customer Success<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Onboarding and Implementation<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Sales Operations<\/strong><\/p>\n<\/li>\n<li>\n<p><strong>Team Lead<\/strong>, then management<\/p>\n<\/li>\n<\/ul>\n<p><strong>Noted but out of scope:<\/strong> Strategic AE roles work differently. At that level you are often <strong>giving\ncompanies money, not just taking it<\/strong>. paying out on contracts. Harder job. My own note: <em>\"I\nknow we're not really touching on that.\"<\/em><\/p>", "quotes": []}, {"id": "8.10", "title": "8.10 Building one tool", "html": "<p><strong>The applied AI capstone.<\/strong><\/p>\n<p>Pick one repetitive task in your own day. Build something small that removes it. Show it to the team.<\/p>\n<p><strong>This is the bridge to Course Two<\/strong>. the same skills pointed at your own business instead of an\nemployer's.<\/p>", "quotes": []}], "examples": [{"id": "8.3", "title": "8.3 The real reason", "html": "<blockquote>\n<p><strong>\"A lot of people get washed out just off of effort.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>My example:<\/strong><\/p>\n<blockquote>\n<p>If your talk time is under two hours, they will tell you that you need <strong>at least 100 touch points\na day.<\/strong> Make sure you get that.<\/p>\n<\/blockquote>\n<p><strong>The fix is mapping your day:<\/strong><\/p>\n<blockquote>\n<p><strong>\"There is a time for research and there's a time to just pick up the phone and dial.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Smiling and dialing.<\/strong> Especially in an SDR role.<\/p>\n<blockquote>\n<p><strong>\"That's the only way you get better.\"<\/strong><\/p>\n<\/blockquote>\n<h3>And the other quiet killer. quitting on accounts too early<\/h3>\n<p>From Module 3: <strong>roughly 10 touch points<\/strong> before you move on.<\/p>\n<blockquote>\n<p><strong>\"You don't want to have two touch points and you've never talked to anybody. You've never been\ntold no. You've never been told do not call.\"<\/strong><\/p>\n<p><strong>\"At two or three touch points you're not going to get any sales. You're not going to meet goal.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Most new reps never learn this is why they missed goal.<\/strong><\/p>", "quotes": ["<blockquote>\n<p><strong>\"A lot of people get washed out just off of effort.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p>If your talk time is under two hours, they will tell you that you need <strong>at least 100 touch points\na day.<\/strong> Make sure you get that.<\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"There is a time for research and there's a time to just pick up the phone and dial.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"That's the only way you get better.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"You don't want to have two touch points and you've never talked to anybody. You've never been\ntold no. You've never been told do not call.\"<\/strong><\/p>\n<\/blockquote>", "<blockquote>\n<p><strong>\"At two or three touch points you're not going to get any sales. You're not going to meet goal.\"<\/strong><\/p>\n<\/blockquote>"]}, {"id": "8.5", "title": "8.5 One-on-ones and call reviews", "html": "<p><strong>These do not stop when you get tenured.<\/strong><\/p>\n<p><strong>With your manager you go over your phone calls together and break them down.<\/strong><\/p>\n<p><strong>And the thing that makes it work:<\/strong><\/p>\n<blockquote>\n<p><strong>\"Most of the time when you listen back, you immediately know what you could have said different,\nor what you said too early, if you got impatient. You can just kind of tell.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>You do not need somebody to tell you what went wrong. Hearing it is the lesson.<\/strong><\/p>", "quotes": ["<blockquote>\n<p><strong>\"Most of the time when you listen back, you immediately know what you could have said different,\nor what you said too early, if you got impatient. You can just kind of tell.\"<\/strong><\/p>\n<\/blockquote>"]}], "quote": "<blockquote>\n<p><strong>A lot of times they will ask you to volunteer to share it with the organization during the big\nhuddle.<\/strong><\/p>\n<\/blockquote>", "activities": "<ol>\n<li><strong>30, 60 and 90 plan<\/strong> for a real target company.<\/li>\n<li><strong>Diagnostic drill.<\/strong> Three fictional reps, three sets of numbers, each behind for a different\n   reason. Identify which step is broken for each.<\/li>\n<li><strong>Coaching role-play.<\/strong> One brings numbers to a one-on-one, the other gives one piece of hard\n   feedback. Swap. Debrief on how it felt to receive it.<\/li>\n<li><strong>Start the accomplishment log in the room.<\/strong> First entry: finishing this course.<\/li>\n<\/ol>", "ai": "<p>Organizing your numbers before a coaching meeting. Documenting improvements as they happen. <strong>Building\none small tool that removes a repetitive task.<\/strong><\/p>", "pages": ["15", "16B", "16C", "17"]}]}], "pages": [{"id": "1", "title": "Before you dial", "condition": "you are about to make your first call of the day.", "html": "<p><strong>You are here if:<\/strong> you are about to make your first call of the day.<\/p>\n<p><strong>The morning, in order:<\/strong><\/p>\n<ol>\n<li>Open your pipeline first. Not your email.<\/li>\n<li>Open the list view filtered to today. Tasks with due dates.<\/li>\n<li>Block the day on your calendar. Prospecting block, follow up block, meetings, admin.<\/li>\n<li>Protect the prospecting block. It is the one that always gets eaten.<\/li>\n<\/ol>\n<p><strong>Before each individual call, know these four things:<\/strong><\/p>\n<ul>\n<li>Who you are calling<\/li>\n<li>Their time zone<\/li>\n<li>What the company does<\/li>\n<li>What the notes say<\/li>\n<\/ul>\n<p><strong>Most accounts have been worked before.<\/strong> There is history. Who owns it. Who the gatekeeper is.\nWhat happened last time.<\/p>\n<p><strong>Seasoned reps scan the notes while the phone is ringing.<\/strong> You will get there. Until then, read\nthem first.<\/p>\n<p><em>My accounts for today:<\/em><\/p>\n<p><label class=\"writein\">Your words 1<textarea data-note=\"page-1-1\" rows=\"3\"><\/textarea><\/label><\/p>\n<hr />"}, {"id": "1B", "title": "The gatekeeper", "condition": "somebody who is not the decision maker picked up.", "html": "<p><strong>You are here if:<\/strong> somebody who is not the decision maker picked up.<\/p>\n<p><strong>They are the person you will run into the most.<\/strong> They decide how much you get.<\/p>\n<p><strong>The mistake is getting irritated. Do not try to get past them. Talk to them.<\/strong><\/p>\n<p><strong>Open by respecting their time, not by asking for something:<\/strong><\/p>\n<blockquote>\n<p><em>\"Hey, I don't want to interrupt you, I know you got a lot going on today. By the way, how was\nyour day?\"<\/em><\/p>\n<\/blockquote>\n<p><strong>If there is history, say it:<\/strong><\/p>\n<blockquote>\n<p><em>\"They've reached out to us, they continue to reach out to us.\"<\/em><\/p>\n<\/blockquote>\n<p><strong>Act like you know who the decision maker is.<\/strong> The name may be in your notes.<\/p>\n<p><strong>Then ask for the path, not the person:<\/strong><\/p>\n<blockquote>\n<p><em>\"I don't want to clog up your day. What's a good time to reach them? Do they have a direct email?\nWhat's a better email? What about a cell phone? Is there any way you can message them now, or pass\nalong a message?\"<\/em><\/p>\n<\/blockquote>\n<p><strong>Calling back at a different time often works.<\/strong> They are frequently more polite.<\/p>\n<p><strong>And the warning: it is a fine line between persistent and burning the call.<\/strong><\/p>\n<p><em>Her name, and what worked:<\/em><\/p>\n<p><label class=\"writein\">Your words 1<textarea data-note=\"page-1B-1\" rows=\"3\"><\/textarea><\/label><\/p>\n<hr />"}, {"id": "2", "title": "The opener", "condition": "somebody just picked up.", "html": "<p><strong>You are here if:<\/strong> somebody just picked up.<\/p>\n<p><strong>At a small business, assume you have the decision maker.<\/strong> Usually you do.<\/p>\n<p><strong>Structure:<\/strong> Your name. A permission ask. Why you are calling.<\/p>\n<p>My version of the permission ask:<\/p>\n<blockquote>\n<p><strong>\"You got ten seconds?\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Keep it short.<\/strong> The opener is not the pitch. The opener buys you the right to ask a question.<\/p>\n<p><strong>Write your own opener here. Say it out loud until it sounds like you and not like a script.<\/strong><\/p>\n<p><label class=\"writein\">Your words 1<textarea data-note=\"page-2-1\" rows=\"3\"><\/textarea><\/label><\/p>\n<p><em>This page is my own approach, from my own calls. It is experience, not published data.<\/em><\/p>\n<hr />"}, {"id": "3", "title": "Read the reaction before anything else", "condition": "they responded and you are about to keep talking.", "html": "<p><strong>You are here if:<\/strong> they responded and you are about to keep talking.<\/p>\n<p><strong>Stop. Which one is this?<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>What you hear<\/th>\n<th>What it means<\/th>\n<th>Your next sentence<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>They do not know you<\/td>\n<td>Cold. Normal.<\/td>\n<td>Proceed with your opener.<\/td>\n<\/tr>\n<tr>\n<td>\"Not you again\"<\/td>\n<td>Somebody burned this account<\/td>\n<td>Acknowledge it fast, do not pretend it did not happen.<\/td>\n<\/tr>\n<tr>\n<td>They showed interest before and got dropped<\/td>\n<td><strong>This is an opening, not a problem<\/strong><\/td>\n<td><em>\"Give me a minute to tell you where we dropped the ball.\"<\/em><\/td>\n<\/tr>\n<tr>\n<td>Rushed, distracted, in the field<\/td>\n<td>Wrong time, not wrong person<\/td>\n<td>Ask for a time. Get it on the calendar.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Cold, warm and burned are three different calls.<\/strong> The second sentence changes. The rest of the\nbook does not.<\/p>\n<p><em>What I hear most on my accounts, and what I say back:<\/em><\/p>\n<p><label class=\"writein\">Your words 1<textarea data-note=\"page-3-1\" rows=\"3\"><\/textarea><\/label><\/p>\n<hr />"}, {"id": "4", "title": "The up front contract", "condition": "you have permission to keep talking and have not agreed on what happens next.", "html": "<p><strong>You are here if:<\/strong> you have permission to keep talking and have not agreed on what happens next.<\/p>\n<p>Agree at the top what happens at the end. It costs fifteen seconds and it saves the close.<\/p>\n<p>Roughly: here is what I would like to cover, here is how long it will take, and at the end either\nthis is a fit and we talk about next steps, or it is not and we both move on. Is that fair?<\/p>\n<p><strong>Why this page exists:<\/strong> without it, the end of the call is a surprise to them. With it, the end of\nthe call is something you both already agreed to.<\/p>\n<p><em>My version:<\/em><\/p>\n<p><label class=\"writein\">Your words 1<textarea data-note=\"page-4-1\" rows=\"3\"><\/textarea><\/label><\/p>\n<hr />"}, {"id": "5", "title": "Discovery", "condition": "you are asking questions. Or you should be.", "html": "<p><strong>You are here if:<\/strong> you are asking questions. Or you should be.<\/p>\n<p><strong>TALK RATIO: YOU 40. THEM 60.<\/strong> If you are talking more than they are, stop.<\/p>\n<p><strong>Open ended only.<\/strong> What, how, tell me about. Never a question they can answer with one word.<\/p>\n<p><strong>Second level questions are where the real answer is.<\/strong> Their first answer is the public version.<\/p>\n<p><strong>THE STORY OPENER.<\/strong> Before you get into the business, ask them to tell you the story of it.<\/p>\n<p>They ramble. In the rambling you get the emotional connection to the thing they built.<\/p>\n<p><strong>It is a logical sale and an emotional sale.<\/strong> You need both.<\/p>\n<p><strong>Questions I use to go deeper:<\/strong><\/p>\n<ul>\n<li>Have you invested in the business<\/li>\n<li>Have you tried advertising<\/li>\n<li>Have you tried marketing<\/li>\n<\/ul>\n<p><strong>THE LINE TO REMEMBER:<\/strong><\/p>\n<blockquote>\n<p><strong>Most of the time they will tell you their own solution in discovery, if you let them talk.<\/strong><\/p>\n<\/blockquote>\n<p><em>My discovery questions, in my order:<\/em><\/p>\n<p><label class=\"writein\">Your words 1<textarea data-note=\"page-5-1\" rows=\"3\"><\/textarea><\/label><\/p>\n<hr />"}, {"id": "6", "title": "Reflect back", "condition": "discovery is winding down.", "html": "<p><strong>You are here if:<\/strong> discovery is winding down.<\/p>\n<blockquote>\n<p><strong>\"From what I'm hearing, you need this, this and that.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Do not assume the problem. Confirm it.<\/strong><\/p>\n<p>This is also your checkpoint. If you cannot say their problem back to them in one sentence, you did\nnot do discovery. Go back to <button class=\"textlink\" data-page=\"5\">Page 5<\/button>.<\/p>\n<hr />"}, {"id": "7", "title": "Did i qualify, or did i just have a nice conversation", "condition": "you like this call and want to move it forward.", "html": "<p><strong>You are here if:<\/strong> you like this call and want to move it forward.<\/p>\n<p><strong>MEDDIC. This is a checklist, not a script. Check it before you present.<\/strong><\/p>\n<ul>\n<li>[ ] <strong>M. Metrics.<\/strong> What number does this move for them, and by how much<\/li>\n<li>[ ] <strong>E. Economic buyer.<\/strong> Who signs<\/li>\n<li>[ ] <strong>D. Decision criteria.<\/strong> What are they comparing you against<\/li>\n<li>\n<p>[ ] <strong>D. Decision process.<\/strong> <strong>Who else is involved, and what happens between yes and signed<\/strong><\/p>\n<\/li>\n<li>\n<p>[ ] <strong>I. Identify pain.<\/strong> What is it costing them right now<\/p>\n<\/li>\n<li>[ ] <strong>C. Champion.<\/strong> Who inside wants this to happen<\/li>\n<\/ul>\n<p><strong>The second D is the one that saves you.<\/strong> Ask who else is involved NOW and \"let me talk to my\nwife\" never surprises you at the close.<\/p>\n<p><strong>Spending capacity, without asking about budget.<\/strong> I never asked Pete his budget. I learned\nit from what was visible: eight vans, then an acquisition, then eighteen trucks, and a general\nmanager on salary. What they already spend tells you what they can spend.<\/p>\n<p><strong>Do not ask \"what's your budget.\"<\/strong> You will get a lowball number and then negotiate against that\nnumber for the rest of the call.<\/p>\n<p><em>What tells me this account can spend:<\/em><\/p>\n<p><label class=\"writein\">Your words 1<textarea data-note=\"page-7-1\" rows=\"3\"><\/textarea><\/label><\/p>\n<hr />"}, {"id": "7B", "title": "The next step", "condition": "the call went well and you want to lock something in.", "html": "<p><strong>You are here if:<\/strong> the call went well and you want to lock something in.<\/p>\n<p><strong>A next step is a read on urgency, not a slot on a calendar.<\/strong><\/p>\n<p><strong>Discovery should have already told you five things:<\/strong><\/p>\n<ul>\n<li>[ ] What kind of <strong>urgency<\/strong> they have<\/li>\n<li>\n<p>[ ] Their <strong>timeline<\/strong><\/p>\n<\/li>\n<li>\n<p>[ ] Whether they are <strong>ready to invest<\/strong><\/p>\n<\/li>\n<li>\n<p>[ ] <strong>How curious<\/strong> they are<\/p>\n<\/li>\n<li>[ ] Whether they are <strong>just curious, or actively looking for a solution<\/strong><\/li>\n<\/ul>\n<p><strong>If you cannot answer those five, you are not ready to ask. Go back to <button class=\"textlink\" data-page=\"5\">Page 5<\/button>.<\/strong><\/p>\n<p><strong>DO NOT DEFAULT TO NEXT WEEK.<\/strong><\/p>\n<blockquote>\n<p>If somebody is interested, their interest will waver by the time next week comes. You get put off.<\/p>\n<\/blockquote>\n<p><strong>Book it as close in as the urgency justifies.<\/strong><\/p>\n<p><strong>LOCK IT IN BEFORE YOU HANG UP. Send the invite while you are still on the phone:<\/strong><\/p>\n<blockquote>\n<p><em>\"Hey man, I'm a busy guy, I like to stay on top of things. You got that calendar invite? Could you\nhit accept on your end? That'd be awesome.\"<\/em><\/p>\n<\/blockquote>\n<p><strong>A confirmed accept beats a verbal maybe every time.<\/strong><\/p>\n<p><strong>And know the difference:<\/strong> a booked meeting with unknown urgency is an activity metric. A booked\nmeeting where you know their timeline and readiness is pipeline.<\/p>\n<blockquote>\n<p><strong>If you just keep scheduling appointments, you're just an appointment setter.<\/strong><\/p>\n<\/blockquote>\n<hr />"}, {"id": "8", "title": "Presenting", "condition": "you are about to show them something.", "html": "<p><strong>You are here if:<\/strong> you are about to show them something.<\/p>\n<p><strong>This is not a product tour.<\/strong> It is their own words handed back with a solution attached.<\/p>\n<ul>\n<li>Outcomes, not features<\/li>\n<li>Proof and examples, short<\/li>\n<li>Check understanding as you go, not at the end<\/li>\n<\/ul>\n<p><strong>DO NOT STAT DUMP.<\/strong> You will get lost in your own numbers and lose the room.<\/p>\n<p><strong>Know your product's real proof metrics.<\/strong> Four or five, not twenty. At Angi, mine were:\nimpressions, profile interactions, taps to reveal the phone number, map searches.<\/p>\n<p><em>My product's four proof metrics:<\/em><\/p>\n<p><label class=\"writein\">Your words 1<textarea data-note=\"page-8-1\" rows=\"3\"><\/textarea><\/label><\/p>\n<hr />"}, {"id": "9", "title": "The yes ladder", "condition": "you are getting close to asking.", "html": "<p><strong>You are here if:<\/strong> you are getting close to asking.<\/p>\n<p><strong>Micro commitments.<\/strong> Small agreements, stacked, so the final ask is not the first yes.<\/p>\n<p><strong>Trial close:<\/strong><\/p>\n<blockquote>\n<p><strong>\"Once we get this settled, are you ready to move forward today?\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Every yes you collect now is ammunition later.<\/strong> At the close, without them, you are arguing.\nWith them, you are reminding.<\/p>\n<p><em>Yeses I got on this call:<\/em><\/p>\n<p><label class=\"writein\">Your words 1<textarea data-note=\"page-9-1\" rows=\"3\"><\/textarea><\/label><\/p>\n<hr />"}, {"id": "10", "title": "Objections", "condition": "they pushed back.", "html": "<p><strong>You are here if:<\/strong> they pushed back.<\/p>\n<p><strong>First: is this a question, a concern, or an objection?<\/strong> They are three different things.\nClarify before you respond. Most reps answer an objection that was actually a question.<\/p>\n<p><strong>THE FOUR BUCKETS. These are real customer words, not categories somebody made up.<\/strong><\/p>\n<h3>1. No need and status quo<\/h3>\n<ul>\n<li>\"We get a lot of word of mouth\"<\/li>\n<li>\"We're all organic\"<\/li>\n<li>\"I let my work speak for itself\"<\/li>\n<\/ul>\n<p><em>My response:<\/em><\/p>\n<p><label class=\"writein\">Your words 1<textarea data-note=\"page-10-1\" rows=\"3\"><\/textarea><\/label><\/p>\n<h3>2. Been burned before<\/h3>\n<ul>\n<li>\"I've tried other companies\"<\/li>\n<li>\"I already paid someone for SEO and it didn't work\"<\/li>\n<\/ul>\n<p><em>My response:<\/em><\/p>\n<p><label class=\"writein\">Your words 2<textarea data-note=\"page-10-2\" rows=\"3\"><\/textarea><\/label><\/p>\n<h3>3. Somebody else said you're no good<\/h3>\n<ul>\n<li>\"A friend of mine told me it didn't work for them\"<\/li>\n<\/ul>\n<p><strong>This one is harder than price.<\/strong> You are fighting a trusted source, not a number. You will not win\nby arguing with their friend.<\/p>\n<p><em>My response:<\/em><\/p>\n<p><label class=\"writein\">Your words 3<textarea data-note=\"page-10-3\" rows=\"3\"><\/textarea><\/label><\/p>\n<h3>4. Not my decision<\/h3>\n<ul>\n<li>\"Let me talk to my wife\"<\/li>\n<li>\"Let me talk to my business partner\"<\/li>\n<\/ul>\n<p><strong>THIS ONE IS NOT AN OBJECTION.<\/strong> It is a discovery failure showing up late.<\/p>\n<p>If this surprises you at the close, you did not ask who else was involved back on <button class=\"textlink\" data-page=\"7\">Page 7<\/button>.<\/p>\n<p><strong>Nothing on this page fixes it in the moment. Go back and fix <button class=\"textlink\" data-page=\"7\">Page 7<\/button> on your next call.<\/strong><\/p>\n<hr />"}, {"id": "11", "title": "Looping", "condition": "you handled an objection and they are still not moving.", "html": "<p><strong>You are here if:<\/strong> you handled an objection and they are still not moving.<\/p>\n<p>Handle it. Rebuild certainty. Close again. Repeat.<\/p>\n<p><strong>AN OBJECTION IS NOT A NUMBER.<\/strong> Do not drop your price because they pushed back. Find the\ndisconnect.<\/p>\n<hr />"}, {"id": "12", "title": "Price", "condition": "it is time to say the number, or they asked.", "html": "<p><strong>You are here if:<\/strong> it is time to say the number, or they asked.<\/p>\n<h2>THE THREE LINES<\/h2>\n<blockquote>\n<p><strong>1. If they don't see value, five dollars is too much.<\/strong><\/p>\n<p><strong>2. Don't spend other people's money with your pockets.<\/strong><\/p>\n<p><strong>3. Once you let price go, you can't take it back.<\/strong><\/p>\n<\/blockquote>\n<h2>Delivering it<\/h2>\n<ul>\n<li>\n<p><strong>Even when they ask directly, do not blurt it.<\/strong><\/p>\n<\/li>\n<li>\n<p>You already know from discovery what they spend elsewhere. That tells you how they value the\n  category.<\/p>\n<\/li>\n<li>Frame the number attached to the specific problems they described. Not to your feature list.<\/li>\n<li><strong>Do not bundle extras up front.<\/strong> Free things given before agreement buy nothing. Extras come\n  after they agree to spend.<\/li>\n<li>Tiered, with a clear next step at each tier.<\/li>\n<\/ul>\n<h2>THE TWO STORIES<\/h2>\n<p><strong>Thumbtack.<\/strong> I quoted $2,500 a month. At the end of the call the customer volunteered that\nhe was already paying Thumbtack about $6,000. I had priced from my own wallet, not the\ncustomer's. That is line two.<\/p>\n<p><strong>Pete, in Greensboro.<\/strong> Electrical and HVAC. Eight vans, then bought a Charlotte company with ten\nSprinter vans, ended up around eighteen trucks, with a GM on salary near $85,000. Pete told me\nit was the best sales call he had ever been on, then gave me this:<\/p>\n<blockquote>\n<p><em>For somebody like me who's obviously spending money, and the questions you asked already verified\nI spend money, don't ever bring up money before we get to the spending part.<\/em><\/p>\n<\/blockquote>\n<h2>PRICE RESISTANCE IS DIAGNOSTIC<\/h2>\n<p><strong>If they get wary at the number, that is information about what you skipped.<\/strong><\/p>\n<p>Their reaction tells you which step did not land. You do not argue price. You go back and find the\nhole. <strong>That is what this book is for.<\/strong> Go to <button class=\"textlink\" data-page=\"15\">Page 15<\/button>.<\/p>\n<hr />"}, {"id": "13", "title": "The close", "condition": "you said the number.", "html": "<p><strong>You are here if:<\/strong> you said the number.<\/p>\n<blockquote>\n<h1>SILENCE IS CONFIDENCE.<\/h1>\n<h2>Say the number and stop talking.<\/h2>\n<\/blockquote>\n<p><strong>There will be a weird pause. It feels worse to you than it does to them.<\/strong><\/p>\n<p>Filling it is how reps talk themselves into a discount nobody asked for.<\/p>\n<h2>\"Let me think about it. Call me tomorrow.\"<\/h2>\n<ul>\n<li>Keep it light. Match the tone of the call. Do not offend.<\/li>\n<li>\n<p>Then hand them back their own words: <em>you reached out to us first. You told me your friends are\n  using it and it's working.<\/em><\/p>\n<\/li>\n<li>\n<p><strong>This only works if you collected the yeses on <button class=\"textlink\" data-page=\"9\">Page 9<\/button>.<\/strong><\/p>\n<\/li>\n<\/ul>\n<p><em>What they told me earlier that I can hand back:<\/em><\/p>\n<p><label class=\"writein\">Your words 1<textarea data-note=\"page-13-1\" rows=\"3\"><\/textarea><\/label><\/p>\n<hr />"}, {"id": "14", "title": "The no", "condition": "they said no.", "html": "<p><strong>You are here if:<\/strong> they said no.<\/p>\n<ul>\n<li>Not everyone buys.<\/li>\n<li>\n<p><strong>A flat no means stop pushing.<\/strong><\/p>\n<\/li>\n<li>\n<p>Some shops run turn it or burn it. Some run relationship. Know which one you are in.<\/p>\n<\/li>\n<li>Walking away well leaves the door open. Arguing closes it permanently.<\/li>\n<\/ul>\n<hr />"}, {"id": "15", "title": "They balked. what did i skip?", "condition": "something went wrong and you do not know where.", "html": "<p><strong>This is the rescue page. This is the reason the book exists.<\/strong><\/p>\n<p><strong>You are here if:<\/strong> something went wrong and you do not know where.<\/p>\n<p>Work backward. Find the first NO.<\/p>\n<table>\n<thead>\n<tr>\n<th>Ask yourself<\/th>\n<th>If no, go to<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Did I get permission to keep talking?<\/td>\n<td><button class=\"textlink\" data-page=\"2\">Page 2<\/button><\/td>\n<\/tr>\n<tr>\n<td>Did I read whether this was cold, warm or burned?<\/td>\n<td><button class=\"textlink\" data-page=\"3\">Page 3<\/button><\/td>\n<\/tr>\n<tr>\n<td>Did I set the up front contract?<\/td>\n<td><button class=\"textlink\" data-page=\"4\">Page 4<\/button><\/td>\n<\/tr>\n<tr>\n<td>Did I actually do discovery, or did I start pitching?<\/td>\n<td><button class=\"textlink\" data-page=\"5\">Page 5<\/button><\/td>\n<\/tr>\n<tr>\n<td>Was I under 40 percent of the talking?<\/td>\n<td><button class=\"textlink\" data-page=\"5\">Page 5<\/button><\/td>\n<\/tr>\n<tr>\n<td>Did I ask them to tell me the story of the business?<\/td>\n<td><button class=\"textlink\" data-page=\"5\">Page 5<\/button><\/td>\n<\/tr>\n<tr>\n<td>Did I say their problem back to them and get confirmation?<\/td>\n<td><button class=\"textlink\" data-page=\"6\">Page 6<\/button><\/td>\n<\/tr>\n<tr>\n<td>Do I know who else has to say yes?<\/td>\n<td><button class=\"textlink\" data-page=\"7\">Page 7<\/button><\/td>\n<\/tr>\n<tr>\n<td>Do I know what they already spend?<\/td>\n<td><button class=\"textlink\" data-page=\"7\">Page 7<\/button><\/td>\n<\/tr>\n<tr>\n<td>Did I present outcomes, or did I stat dump?<\/td>\n<td><button class=\"textlink\" data-page=\"8\">Page 8<\/button><\/td>\n<\/tr>\n<tr>\n<td>Did I get any yeses before I asked?<\/td>\n<td><button class=\"textlink\" data-page=\"9\">Page 9<\/button><\/td>\n<\/tr>\n<tr>\n<td>Did I loop, or did I fold on the first no?<\/td>\n<td><button class=\"textlink\" data-page=\"11\">Page 11<\/button><\/td>\n<\/tr>\n<tr>\n<td>Did I stay silent after the number?<\/td>\n<td><button class=\"textlink\" data-page=\"13\">Page 13<\/button><\/td>\n<\/tr>\n<tr>\n<td>Did I work the gatekeeper, or try to beat her?<\/td>\n<td><button class=\"textlink\" data-page=\"1B\">Page 1B<\/button><\/td>\n<\/tr>\n<tr>\n<td>Do I know their urgency, timeline and readiness?<\/td>\n<td><button class=\"textlink\" data-page=\"7B\">Page 7B<\/button><\/td>\n<\/tr>\n<tr>\n<td>Did I book too far out?<\/td>\n<td><button class=\"textlink\" data-page=\"7B\">Page 7B<\/button><\/td>\n<\/tr>\n<tr>\n<td>Did I quit on this account too early?<\/td>\n<td><button class=\"textlink\" data-page=\"16B\">Page 16B<\/button><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>The problem is almost never where you are. It is one step back.<\/strong><\/p>\n<hr />"}, {"id": "16", "title": "After they say yes", "condition": "they agreed.", "html": "<p><strong>You are here if:<\/strong> they agreed.<\/p>\n<h2>Cold feet is real and it is worth rehearsing<\/h2>\n<p><strong>People back out mid onboarding, after signing and before the sale finalizes.<\/strong><\/p>\n<p>Coaching them through the wobble:<\/p>\n<blockquote>\n<p><em>I get it. I got you. Let's finish this last part so we can get you going.<\/em><\/p>\n<\/blockquote>\n<h2>Document exactly what you promised<\/h2>\n<p>Word for word. Onboarding cannot contradict you if they know what you said.<\/p>\n<h2>MY POSITION, AND IT IS A DIFFERENCE WORTH NAMING<\/h2>\n<blockquote>\n<p><strong>I onboard the customer myself. Every place I have worked, regardless of who is behind me.<\/strong><\/p>\n<\/blockquote>\n<p>Customer success gets busy and carries their own workload. <strong>It is your retention, your account,\nyour money.<\/strong><\/p>\n<p><strong>The position taught here is to protect it.<\/strong><\/p>\n<p><em>What I promised, exactly:<\/em><\/p>\n<p><label class=\"writein\">Your words 1<textarea data-note=\"page-16-1\" rows=\"3\"><\/textarea><\/label><\/p>\n<hr />"}, {"id": "16B", "title": "When to let an account go", "condition": "you are wondering whether this account is dead.", "html": "<p><strong>You are here if:<\/strong> you are wondering whether this account is dead.<\/p>\n<p><strong>Roughly 10 touch points with no clear communication before you move on.<\/strong><\/p>\n<p><strong>But the real mistake is quitting early:<\/strong><\/p>\n<blockquote>\n<p><strong>\"You don't want to have two touch points and you've never talked to anybody. You've never been\ntold no. You've never been told do not call.\"<\/strong><\/p>\n<p><strong>\"At two or three touch points you're not going to get any sales. You're not going to meet goal.\"<\/strong><\/p>\n<\/blockquote>\n<p><strong>Before you mark anything closed lost, check your touch point count.<\/strong><\/p>\n<p><em>My count on this account:<\/em> <\/p>\n<p><label class=\"writein\">Your words 1<textarea data-note=\"page-16B-1\" rows=\"3\"><\/textarea><\/label><\/p>\n<p><strong>High ticket is different.<\/strong> More relationship building, longer runway.<\/p>\n<p><strong>And sometimes you do just have to move on. It is what it is.<\/strong><\/p>\n<hr />"}, {"id": "16C", "title": "Things that are normal", "condition": "you think you are failing.", "html": "<p><strong>You are here if:<\/strong> you think you are failing.<\/p>\n<ul>\n<li><strong>You are going to fail every day.<\/strong> When you win, it is worth it.<\/li>\n<li><strong>Everybody gets QA. Everybody gets QA fails.<\/strong> It is part of it.<\/li>\n<li><strong>You will feel lost for two weeks.<\/strong> Better by week four.<\/li>\n<li><strong>Hearing your own voice on a recording is uncomfortable.<\/strong> That is how you get better.<\/li>\n<li><strong>Most people do not come out of the box killing it.<\/strong> They want to see effort.<\/li>\n<li><strong>A stranger telling you no never hurt anybody.<\/strong> You are not losing anything in the conversation.<\/li>\n<\/ul>\n<p><strong>And from somebody who has done this for years:<\/strong><\/p>\n<blockquote>\n<p><strong>\"I still get nervous hopping on the phone calling somebody. I don't think that ever goes away.\"<\/strong><\/p>\n<\/blockquote>\n<hr />"}, {"id": "17", "title": "My own words", "condition": "", "html": "<p>The lines in this book are somebody else's. These pages are yours.<\/p>\n<p>Write down the thing you said that worked. Write down the thing you said that killed a call. Both\nare worth more than anything printed in here, because they came out of your mouth.<\/p>\n<p><em>What worked:<\/em><\/p>\n<p><label class=\"writein\">Your words 1<textarea data-note=\"page-17-1\" rows=\"3\"><\/textarea><\/label><\/p>\n<p><em>What did not:<\/em><\/p>\n<p><label class=\"writein\">Your words 2<textarea data-note=\"page-17-2\" rows=\"3\"><\/textarea><\/label><\/p>\n<hr />"}], "workshop": {"sessions": {"1": {"description": "See what the work looks like, understand how you get paid, and decide whether it fits your life.", "quote": "For the most part, you're a business consultant. Where you work, you're the expert on the knowledge.", "groups": [["The work", ["1.3"]], ["The roles", ["1.4", "1.5", "1.6"]], ["The paycheck", ["1.7", "1.8", "1.9", "1.2"]], ["Your fit", ["1.1", "1.10", "1.11"]]], "practice": [{"title": "Choose a role that fits your life", "format": "Individual reflection", "steps": ["Look back at the roles and work arrangements in this session. Choose one you want to explore.", "Explain what that person does during the day and why it connects to your experience.", "Name the part of the work you would enjoy and the part you would find difficult."], "output": "Your target role and your honest reason for choosing it."}, {"title": "Compare what employers actually ask for", "format": "Job research", "steps": ["Find three job ads for the same role at different companies.", "Compare the daily responsibilities, required experience and work arrangement.", "Separate stated requirements from broad phrases about the ideal candidate. Decide which role fits you best."], "output": "A shortlist of roles based on the work, not just the title."}], "introduction": {"title": "What does a sales rep actually do?", "text": "You learn about a business, understand what it needs, and work out whether your product can help. The work starts before the call and continues after the customer says yes.", "steps": [["Prepare", "Know who you are calling and what their business does."], ["Understand", "Ask questions, listen and confirm the problem."], ["Follow through", "Explain the solution, agree on a next step and keep your promises."]]}, "presentation": [{"type": "teaching", "title": "What the work actually involves", "cards": [{"title": "Before the conversation", "points": ["Choose an account. Know the business. Read the history before you call."]}, {"title": "During the conversation", "points": ["Ask questions and listen. Confirm the problem before you explain a solution."]}, {"title": "After the conversation", "points": ["Record what you promised. Set a next action. Stay involved through onboarding."]}]}, {"type": "teaching", "title": "Different roles. Different parts of the work.", "cards": [{"title": "SDR and BDR", "points": ["Prospect, build pipeline, handle first objections and create opportunities for the next conversation."]}, {"title": "Account Executive", "points": ["Run the sales process and ask for the business."]}, {"title": "Account Manager and Customer Success", "points": ["Work with the customer after the sale. Keep the customer first and help the relationship continue."]}, {"title": "Read the actual job description", "points": ["Titles and responsibilities vary. Compare the work, the training and the work arrangement."]}]}, {"type": "teaching", "title": "Understand the paycheck", "cards": [{"title": "Base pay", "points": ["The part you receive regardless of what you sell."]}, {"title": "Commission", "points": ["Incentive pay connected to results. Ask how it is measured and when it is paid."]}, {"title": "Retention", "points": ["Some roles also reward keeping customers. Ask whether retention is part of the plan and how it is calculated."]}, {"title": "Ask about the whole offer", "points": ["Know the goal, the ramp period, the benefits and when they become active."]}]}, {"type": "teaching", "title": "Decide whether the work fits you", "cards": [{"title": "Your experience counts", "points": ["Customer-facing work, trade knowledge and your own personality can translate into the role."]}, {"title": "The work takes repetition", "points": ["You will hear no. You will make calls that do not go well. Practice and consistent effort matter."]}, {"title": "Choose the environment", "points": ["Consider inside, outside, hybrid or remote work. Look at the company and the support it gives new reps."]}]}]}, "2": {"description": "Turn your actual work history into a credible application and an introduction that sounds like you.", "quote": "Who you show up to work as every day is who they want to actually meet.", "groups": [["Find your evidence", ["2.1", "2.2", "2.3", "2.4"]], ["Build the application", ["2.5"]], ["Introduce yourself", ["2.6", "2.7"]]], "practice": [{"title": "Find the evidence in your work history", "format": "Individual, then pairs", "steps": ["List the jobs you have done. Pull out work involving customers, crews, multiple jobs or homeowners.", "Name what was measurable or notable. Use only claims you can explain honestly.", "Tell a partner how that experience connects to a sales role. Let them point out strengths you overlooked."], "output": "Work experience you can use in your resume."}, {"title": "Introduce yourself in thirty seconds", "format": "Partner practice", "steps": ["Say who you are, what you have done and what you want to work toward.", "Keep your personality in it. Tell the truth and use your own voice.", "Say it to one person without reading. Ask for one piece of feedback, then try again."], "output": "An introduction you can say naturally."}], "presentation": [{"type": "teaching", "title": "Start with evidence you can defend", "cards": [{"title": "Customer experience", "points": ["Look for work where you dealt with customers regularly or at high volume."]}, {"title": "Trade experience", "points": ["Crew leadership, running multiple jobs and dealing with homeowners are relevant experience."]}, {"title": "Product knowledge", "points": ["Knowing the industry from the customer side can give you a head start."]}]}, {"type": "teaching", "title": "Match your application to the work", "cards": [{"title": "Read the posting", "points": ["Compare the requirements with what you have actually done."]}, {"title": "Use your real evidence", "points": ["Name relevant work, software, classes and experience. Check every date, title and number."]}, {"title": "Keep the same person throughout", "points": ["Your resume, professional profile and introduction should agree with each other."]}]}, {"type": "teaching", "title": "Introduce the person who will show up", "cards": [{"title": "Who you are", "points": ["Give a little personality and tell the truth."]}, {"title": "Where you want to go", "points": ["Explain your goals and ask what is expected of you."]}, {"title": "Say it out loud", "points": ["Keep it to thirty seconds. Use words you would actually say."]}]}]}, "3": {"description": "Know who you will meet, prepare useful questions, and rehearse handling an objection and keeping the call moving.", "quote": "You don't have to get everything right or perfect. They want to see that you know how to move a call along.", "groups": [["Meet the people", ["3.1", "3.2", "3.3", "3.4"]], ["Prepare your questions", ["3.5"]], ["Rehearse and follow up", ["3.6", "3.7"]]], "practice": [{"title": "Run the mock cold call", "format": "Pairs, then swap", "steps": ["One of you is the customer and one is the rep. The customer picks an objection to open with: \"I am busy,\" \"I have another prospect on the line,\" or \"not interested.\"", "The rep opens the call, takes the objection without arguing, asks one question, and keeps going.", "Get to one discovery question and one trial close. Do not worry about polish.", "Swap roles. The person watching says only one thing afterward: did the call keep moving, or did it stall."], "output": "One call you have run out loud, and one objection you have already handled before an interviewer throws it at you."}, {"title": "Prepare the questions you will ask", "format": "Individual preparation", "steps": ["Read the three questions in this session.", "Write each question in your own words and match it to the recruiter, hiring manager or team lead.", "Practice asking them out loud so they sound like a conversation."], "output": "Three questions and a clear idea of who to ask."}, {"title": "Write the follow-up", "format": "Individual writing", "steps": ["Write a short message to the recruiter thanking them for connecting you with the interviewer.", "Refer to the person you spoke with.", "Read it aloud and remove wording you would never actually say."], "output": "A follow-up in your own voice."}], "presentation": [{"type": "teaching", "title": "Understand who you will meet", "cards": [{"title": "Recruiter", "points": ["An initial conversation about you, the role, expectations and pay."]}, {"title": "Hiring manager", "points": ["Meet the person evaluating how you will approach the work."]}, {"title": "Team lead", "points": ["Often the person you turn to with questions early in the job."]}, {"title": "Sales leadership", "points": ["A later conversation, depending on the company and role."]}]}, {"type": "teaching", "title": "Show that you are ready to dig in", "cards": [{"title": "Be consistent", "points": ["Let your personality show at every stage."]}, {"title": "Ask useful questions", "points": ["Ask what success at 30, 60 and 90 days looks like. Ask the team lead or manager what top performers do consistently."]}, {"title": "Know the people", "points": ["Build rapport with the team lead as well as the biggest title."]}]}, {"type": "teaching", "title": "Handle the objection and keep the call moving", "cards": [{"title": "Open", "points": ["Know the company information you received, then begin the call."]}, {"title": "Expect an objection early", "points": ["\"I am busy.\" \"I have another prospect on the line.\" That is the test, not rudeness."]}, {"title": "Handle it", "points": ["Acknowledge it, stay calm, ask one question, and keep the conversation moving."]}, {"title": "Reach a trial close", "points": ["Ask whether they would be ready to move forward if you could solve the needs you uncovered."]}]}, {"type": "teaching", "title": "Follow up through the recruiter", "cards": [{"title": "When", "points": ["That evening or the next morning."]}, {"title": "What", "points": ["Thank the recruiter for the connection and mention the person you met."]}, {"title": "Your voice", "points": ["Keep the message brief and human."]}]}]}, "4": {"description": "Follow the sequence from accepting an offer to setting up your workspace and walking into orientation.", "quote": "The goal is that when the real thing happens, you feel like you have been here before.", "groups": [["Understand the offer", ["4.1", "4.2", "4.3", "4.4"]], ["Get ready for day one", ["4.5", "4.6"]], ["Ask before you accept", ["4.7"]]], "practice": [{"title": "Get ready for your first day", "format": "Individual preparation", "steps": ["Walk through the sequence: equipment, account setup, workspace, meeting the team, orientation and training.", "Identify documents to gather, references to ask and workspace items to sort out.", "Write the questions you still need answered before you start."], "output": "Your own readiness list and first-week questions."}, {"title": "Explain the three parts of pay", "format": "Partner explanation", "steps": ["Use the example in this session to explain base pay, commission and retention.", "Explain why keeping the right customer matters after the sale.", "Say what you would ask the recruiter about how retention is calculated."], "output": "A plain-language explanation of the pay structure."}], "presentation": [{"type": "teaching", "title": "Read the whole offer", "cards": [{"title": "The pay", "points": ["Base, commission, retention and any draw during ramp."]}, {"title": "The package", "points": ["Insurance, benefits and relevant stipends."]}, {"title": "The timing", "points": ["When you start and when each part of the package becomes active."]}]}, {"type": "teaching", "title": "Before the first day", "cards": [{"title": "Equipment arrives", "points": ["Receive the computer and any other equipment provided."]}, {"title": "Accounts and payroll", "points": ["Complete the account setup and paperwork you receive."]}, {"title": "Workspace", "points": ["Check your internet, camera, audio and the place you will work."]}, {"title": "Meet the team", "points": ["Some employers arrange a call with your manager and teammates before you begin."]}]}, {"type": "teaching", "title": "Know the first-week sequence", "cards": [{"title": "Orientation", "points": ["Company history, policies, HR and benefits enrollment."]}, {"title": "The tools", "points": ["Email, calendar, meeting software, CRM and dialer. There is a lot to take in."]}, {"title": "Your department and training", "points": ["Move into the team and start learning the actual job."]}, {"title": "Give yourself time", "points": ["Expect to feel lost for the first two weeks and more settled by week four. That is normal."]}]}]}, "5": {"description": "Learn what the CRM tells you, read the account before you call, and build a day you can actually work.", "quote": "Open your pipeline first. Not your email.", "groups": [["Know the account", ["5.2", "5.3"]], ["Work the pipeline", ["5.4", "5.5"]], ["Run your day", ["5.6", "5.7", "5.8"]]], "practice": [{"title": "Build your working day", "format": "Individual, then pairs", "steps": ["Start with the pipeline and tasks due today.", "Block time for prospecting, follow-up, meetings and admin. Protect the prospecting block.", "Explain your schedule to a partner and defend why you arranged it that way."], "output": "A daily rhythm you can explain and use."}, {"title": "Read before you dial", "format": "Account review", "steps": ["Use an account you are researching in your chosen industry.", "Name the owner, prior attempts, account history and gatekeeper information you actually know.", "Separate what you know from what you still need to find out. Set the next action."], "output": "A clear account brief before the call."}], "presentation": [{"type": "teaching", "title": "Read the account before you dial", "cards": [{"title": "Ownership", "points": ["Is the account yours or assigned to somebody else?"]}, {"title": "History", "points": ["Read the notes and count prior attempts."]}, {"title": "Access", "points": ["Know the gatekeeper information and check whether the account is marked do not call."]}]}, {"type": "teaching", "title": "Know the vocabulary", "cards": [{"title": "The people and business", "points": ["Lead. Contact. Account."]}, {"title": "The work in motion", "points": ["Opportunity. Pipeline. Stage."]}, {"title": "The action and result", "points": ["Activity. Task. Next action. Closed won. Closed lost."]}]}, {"type": "teaching", "title": "Build the day before the first dial", "cards": [{"title": "Start with the pipeline", "points": ["Open the work due today before opening email."]}, {"title": "Protect prospecting", "points": ["Make time for prospecting, follow-up, meetings and admin."]}, {"title": "Close the loop", "points": ["Write a useful note and set a next action with a due date."]}]}]}, "6": {"description": "Choose who to call, earn a conversation, understand the business, and agree on a next step with real urgency.", "quote": "Most of the time they'll tell you their own solution in discovery, if you let them talk.", "groups": [["Prepare the account", ["6.1", "6.2", "6.3", "6.4"]], ["Open the conversation", ["6.5", "6.6", "6.7"]], ["Understand the business", ["6.8", "6.9", "6.10", "6.11"]], ["Earn the next step", ["6.12", "6.13"]]], "practice": [{"title": "Let them tell the story", "format": "Partner role-play", "steps": ["Choose an industry. One person plays the business owner and one plays the rep.", "The rep asks for the story of the business, then listens without pitching.", "Say back the need you heard. Swap roles and discuss what the story revealed."], "output": "A confirmed problem in the customer's own words."}, {"title": "Confirm the next step on the call", "format": "Partner role-play", "steps": ["Say what you know about urgency, timeline, readiness to invest, curiosity and whether they are actively seeking a solution.", "Agree on a meeting close enough to match that urgency.", "Rehearse sending and confirming the invitation before ending the conversation."], "output": "A next step supported by discovery."}], "presentation": [{"type": "teaching", "title": "Prepare a reason to call", "cards": [{"title": "Choose your industry", "points": ["Use a business you can understand. Keep the product simple."]}, {"title": "Research what matters", "points": ["Website, reviews, hours, service area and account history."]}, {"title": "Find relevance", "points": ["Know why this particular business is worth a conversation. Check the time zone."]}]}, {"type": "teaching", "title": "Open and agree on the conversation", "cards": [{"title": "The gatekeeper", "points": ["Respect their time. Ask for the path to the decision maker."]}, {"title": "The opener", "points": ["Your name. A permission ask. Your reason for calling."]}, {"title": "The reaction", "points": ["Notice whether the account is cold, interested or burned by an earlier experience."]}, {"title": "The up-front contract", "points": ["Agree on the purpose, the time and what happens at the end."]}]}, {"type": "teaching", "title": "Discovery is the work", "cards": [{"title": "Ask for the story", "points": ["Let them tell you about the business. Do not turn the first answer into a pitch."]}, {"title": "Listen beyond the first answer", "points": ["Use open questions. The first answer is often the public version."]}, {"title": "Reflect and confirm", "points": ["Say the problem back and get confirmation. Aim for more listening than talking."]}]}, {"type": "teaching", "title": "Earn a next step that means something", "cards": [{"title": "Know the urgency", "points": ["Their timeline, readiness to invest and whether they are actively seeking a solution."]}, {"title": "Know the decision", "points": ["Who else is involved and how they will decide."]}, {"title": "Confirm it now", "points": ["Book close enough to match the urgency. Confirm the invitation while you are still talking."]}]}]}, "7": {"description": "Present the customer's problem back with a solution, handle resistance, and protect the sale through onboarding.", "quote": "If they don't see value, five dollars is too much.", "groups": [["Present what you heard", ["7.1", "7.2"]], ["Handle the resistance", ["7.3", "7.4"]], ["Deliver the price", ["7.5", "7.6", "7.7"]], ["Close and protect it", ["7.8", "7.9"]]], "practice": [{"title": "Answer the four real objections", "format": "Partner role-play", "steps": ["One partner chooses an objection from this session and says it as the customer.", "The rep clarifies before responding. Find the disconnect instead of immediately dropping price.", "Rotate through all four objections. Keep the wording in your own voice."], "output": "Responses you can say naturally under pressure."}, {"title": "Say the price. Hold the silence.", "format": "Partner drill", "steps": ["Use the price for the product you chose to practice.", "Attach it to the problem you heard in discovery. Say the number, then stop talking.", "Have your partner time the pause. Repeat and notice when you feel the urge to fill it."], "output": "Practice delivering a price without negotiating against yourself."}], "presentation": [{"type": "teaching", "title": "Present their problem with a solution", "cards": [{"title": "Their words", "points": ["Show how the solution connects to what they told you."]}, {"title": "Short proof", "points": ["Use the evidence that matters to this customer. Avoid a tour of every feature or metric."]}, {"title": "Small agreements", "points": ["Check understanding before asking for the business."]}]}, {"type": "teaching", "title": "Recognize the resistance", "cards": [{"title": "No need", "points": ["“We get a lot of word of mouth.”"]}, {"title": "Been burned", "points": ["“I already paid someone for SEO and it didn’t work.”"]}, {"title": "A trusted source disagrees", "points": ["“A friend of mine told me it didn’t work for them.”"]}, {"title": "Another decision maker", "points": ["“Let me talk to my business partner.” Go back to what discovery should have established."]}]}, {"type": "teaching", "title": "Keep the price attached to the problem", "cards": [{"title": "Value", "points": ["“If they don’t see value, five dollars is too much.”"]}, {"title": "Spending capacity", "points": ["“Don’t spend other people’s money with your pockets.”"]}, {"title": "Your position", "points": ["“Once you let price go, you can’t take it back.”"]}]}, {"type": "teaching", "title": "Make the ask, then protect the agreement", "cards": [{"title": "Hold the silence", "points": ["Say the number and stop talking."]}, {"title": "Respect a no", "points": ["A flat no means stop pushing."]}, {"title": "Follow through", "points": ["Document what you promised and stay involved through onboarding."]}]}]}, "8": {"description": "Understand ramp, use feedback, review your calls, and build the habits that help you stay and improve.", "quote": "There is a time for research and there's a time to just pick up the phone and dial.", "groups": [["Settle into the work", ["8.1", "8.2", "8.3", "8.4"]], ["Use the feedback", ["8.5", "8.6", "8.7"]], ["Keep moving forward", ["8.8", "8.9", "8.10"]]], "practice": [{"title": "Rehearse a coaching conversation", "format": "Partner role-play", "steps": ["Bring one observation from your own practice to the conversation.", "Your partner gives one specific piece of constructive feedback.", "Explain how you will apply it, then swap roles and discuss how it felt to receive feedback."], "output": "One specific change to put into practice."}, {"title": "Start your accomplishment log", "format": "Individual reflection", "steps": ["Record what you completed or improved during the workshop.", "Describe the work specifically enough that you could explain it later.", "Identify one repetitive task you could simplify and share with the team."], "output": "Your first accomplishment entry and a practical improvement idea."}], "presentation": [{"type": "teaching", "title": "Give yourself room to get good", "cards": [{"title": "Expect training", "points": ["The first weeks are about learning the job."]}, {"title": "Keep the effort visible", "points": ["Meet the activity expectations and organize the day."]}, {"title": "Leave the last rejection behind", "points": ["Do not assume the next person feels like the last one."]}]}, {"type": "teaching", "title": "Use coaching as part of the work", "cards": [{"title": "Listen to your calls", "points": ["Notice what you said too early or could have asked differently."]}, {"title": "Receive the feedback", "points": ["Take constructive criticism as well as compliments."]}, {"title": "Apply one change", "points": ["Show up to the next conversation ready to put the feedback to work."]}]}, {"type": "teaching", "title": "Know the difference between coaching and QA", "cards": [{"title": "Manager call review", "points": ["Break down the call together and improve the work."]}, {"title": "Company QA", "points": ["Check the call against the company’s requirements."]}, {"title": "Keep learning", "points": ["Understand the feedback and the rules that apply at your employer."]}]}, {"type": "teaching", "title": "Record and share what works", "cards": [{"title": "Keep an accomplishment log", "points": ["Write down the work you completed and the improvements you made."]}, {"title": "Make the team better", "points": ["Share a useful technique or a tool that removes repetitive work."]}, {"title": "Choose your next direction", "points": ["Account management, customer success, onboarding, sales operations or team leadership."]}]}]}}, "playbook": [{"title": "Prepare", "subtitle": "Know the account before you pick up the phone.", "pages": ["1", "16B"], "noteLabel": "My accounts today, and what I know about each one", "note": "playbook-prepare", "blocks": [{"title": "The morning, in order", "items": ["Open your pipeline first. Not your email.", "Open the list filtered to today. Tasks with due dates.", "Block the day: prospecting, follow-up, meetings, admin.", "Protect the prospecting block. It is the one that always gets eaten."]}, {"title": "Know these four things before every call", "items": ["Who you are calling", "Their time zone", "What the company does", "What the notes say"]}, {"title": "Read the history", "text": "Most accounts have been worked before. Who owns it. Who the gatekeeper is. What happened last time. Whether it is on the do-not-call list.", "quote": "Seasoned reps scan the notes while the phone is ringing."}, {"title": "Before you give up on an account", "text": "Roughly 10 touch points with no clear communication before you move on. Check your count before you close anything lost.", "quote": "At two or three touch points you're not going to get any sales. You're not going to meet goal."}]}, {"title": "Open", "subtitle": "Earn permission and find out what kind of call this is.", "pages": ["1B", "2", "3", "4"], "noteLabel": "My opener, in my own words", "note": "playbook-open", "blocks": [{"title": "If a gatekeeper picks up", "text": "Do not try to get past them. Talk to them. Open by respecting their time, not by asking for something.", "quote": "Hey, I don't want to interrupt you, I know you got a lot going on today. By the way, how was your day?"}, {"title": "Then ask for the path, not the person", "items": ["“What's a good time to reach them?”", "“Do they have a direct email? What's a better email?”", "“What about a cell phone?”", "“Is there any way you can message them now, or pass along a message?”", "Get her name and write it down. Next call you are not a stranger.", "Never imply you have an appointment. It works once and burns the account."]}, {"title": "The opener", "text": "At a small business, assume you have the decision maker. Your name. A permission ask. Why you are calling. Keep it short.", "quote": "You got ten seconds?"}, {"title": "Read the reaction before anything else", "items": ["They do not know you. Cold. Normal. Proceed.", "“Not you again.” Somebody burned this account. Acknowledge it fast, do not pretend.", "They showed interest before and got dropped. This is an opening: “Give me a minute to tell you where we dropped the ball.”", "Rushed or in the field. Wrong time, not wrong person. Ask for a time and get it on the calendar."]}, {"title": "THE UP-FRONT CONTRACT", "text": "Fifteen seconds. It is the cheapest thing you can do to prevent the objection that kills the close. Without it, the end of the call is a surprise to them.", "quote": "Before I take up your time, let me tell
