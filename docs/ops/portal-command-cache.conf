# LeadCurate OS mobile dashboard freshness rule
# Live source: /etc/nginx/sites-enabled/portal

location /command/ {
    alias /var/www/html/command/;
    index index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}
